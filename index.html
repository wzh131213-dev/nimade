<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

import {
 PoseLandmarker,FilesetResolver
} from
'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';

const $=id=>document.getElementById(id);
const status=$('status');
const video=$('video');
const canvas=$('skeleton');
const ctx=canvas.getContext('2d');

let scene,camera,renderer,character;
let landmarker=null,stream=null;
let running=false,raf=0,lastTime=-1;
let currentPose=null;
let calibrated=false;
let proportions=null;
let lastMeasureTime=0;

const V=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);

const colors={
 skin:0xe8bd9c,
 hair:0x11131c,
 robe:0x172d49,
 robe2:0x263f61,
 armor:0x45617e,
 gold:0xc7a05c,
 pants:0x111c2b,
 boot:0x33271e,
 sword:0xc9d7e5
};

function material(color,metalness=0,roughness=.7){
 return new THREE.MeshStandardMaterial({
  color,metalness,roughness
 });
}

const mats={
 skin:material(colors.skin),
 hair:material(colors.hair),
 robe:material(colors.robe),
 robe2:material(colors.robe2),
 armor:material(colors.armor,.5,.4),
 gold:material(colors.gold,.7,.3),
 pants:material(colors.pants),
 boot:material(colors.boot),
 sword:material(colors.sword,.9,.2)
};

function initScene(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x08111e);
 scene.fog=new THREE.Fog(0x08111e,10,25);

 camera=new THREE.PerspectiveCamera(
  36,innerWidth/innerHeight,.1,100
 );
 camera.position.set(0,2.2,9);
 camera.lookAt(0,1.65,0);

 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 renderer.setSize(innerWidth,innerHeight);
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 renderer.outputColorSpace=THREE.SRGBColorSpace;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;
 renderer.toneMappingExposure=1.2;
 $('scene').appendChild(renderer.domElement);

 scene.add(new THREE.HemisphereLight(0xc9e5ff,0x242031,2));

 const light=new THREE.DirectionalLight(0xffe2bd,3);
 light.position.set(4,8,5);
 light.castShadow=true;
 scene.add(light);

 const rim=new THREE.DirectionalLight(0x4c8dff,2);
 rim.position.set(-5,4,-4);
 scene.add(rim);

 const floor=new THREE.Mesh(
  new THREE.CircleGeometry(5,64),
  material(0x1b2b40,.2,.8)
 );
 floor.rotation.x=-Math.PI/2;
 floor.position.y=-.03;
 floor.receiveShadow=true;
 scene.add(floor);

 const grid=new THREE.GridHelper(12,24,0x34516e,0x1c2e45);
 grid.position.y=-.02;
 scene.add(grid);

 const ring=new THREE.Mesh(
  new THREE.TorusGeometry(1.15,.012,8,80),
  mats.gold
 );
 ring.rotation.x=Math.PI/2;
 ring.position.y=.005;
 scene.add(ring);

 // 先生成默认人物，识别成功后自动调整比例
 character=buildCharacter({
  height:3.6,
  shoulder:.48,
  hip:.34,
  torso:.82,
  upperArm:.43,
  forearm:.40,
  thigh:.52,
  shin:.49,
  head:.23
 });
 scene.add(character);
}

function mesh(parent,geo,mat,name){
 const m=new THREE.Mesh(geo,mat);
 m.name=name;
 m.castShadow=true;
 m.receiveShadow=true;
 parent.add(m);
 return m;
}

function ball(parent,name,r,mat){
 return mesh(parent,new THREE.SphereGeometry(r,20,16),mat,name);
}

function bone(parent,name,r1,r2,mat){
 return mesh(parent,new THREE.CylinderGeometry(r2,r1,1,16),mat,name);
}

function box(parent,name,x,y,z,mat){
 return mesh(parent,new THREE.BoxGeometry(x,y,z),mat,name);
}

function connect(obj,a,b,rx=1,rz=1){
 const av=V(...a),bv=V(...b);
 const d=bv.clone().sub(av);
 obj.position.copy(av).add(bv).multiplyScalar(.5);
 obj.scale.set(rx,d.length(),rz);
 obj.quaternion.setFromUnitVectors(
  V(0,1,0),d.clone().normalize()
 );
}

function buildCharacter(p){
 const root=new THREE.Group();
 root.name='GeneratedWuxiaCharacter';

 const parts={};

 // 按测量比例生成躯干
 const body=new THREE.Group();
 root.add(body);
 parts.body=body;

 const torso=mesh(body,
  new THREE.CylinderGeometry(
   p.shoulder*.49,p.hip*.57,p.torso,24
  ),mats.robe,'torso');
 torso.position.y=p.torso/2+p.thigh+p.shin*.05;

 const chest=mesh(body,
  new THREE.SphereGeometry(1,24,18),
  mats.robe2,'chest');
 chest.scale.set(p.shoulder*.51,p.torso*.34,.19);
 chest.position.set(0,p.thigh+p.shin*.05+p.torso*.70,.02);

 const waist=mesh(body,
  new THREE.CylinderGeometry(
   p.hip*.54,p.hip*.62,.16,20
  ),mats.gold,'belt');
 waist.position.y=p.thigh+p.shin*.05+.08;

 // 下摆
 const skirt=mesh(body,
  new THREE.CylinderGeometry(
   p.hip*.58,p.hip*.95,p.thigh*.85,24,1,true
  ),mats.pants,'robe skirt');
 skirt.position.y=p.thigh*.55;
 skirt.material.side=THREE.DoubleSide;

 // 头颈
 const neck=bone(body,'neck',.075,.085,mats.skin);
 const head=ball(body,'head',p.head,mats.skin);
 const hair=ball(body,'hair',p.head*1.08,mats.hair);
 const bun=ball(body,'hair bun',p.head*.55,mats.hair);

 parts.neck=neck;
 parts.head=head;
 parts.hair=hair;
 parts.bun=bun;

 // 头部、颈部的初始位置
 const shoulderY=p.thigh+p.shin*.05+p.torso;
 const headY=shoulderY+p.head*1.6;
 head.position.set(0,headY,0);
 hair.position.set(0,headY+p.head*.3,-.025);
 bun.position.set(0,headY+p.head*.92,-.05);
 connect(neck,[0,shoulderY,0],[0,headY-p.head*.75,0]);

 // 面部眼睛
 for(const s of [-1,1]){
  const eye=ball(body,'eye',p.head*.10,material(0x10131b));
  eye.position.set(s*p.head*.32,headY,.18);
 }

 // 头发长束
 const pony=bone(body,'ponytail',p.head*.28,p.head*.17,mats.hair);
 connect(pony,[0,headY-p.head*.5,-.16],[0,headY-p.head*2.2,-.25]);

 // 肩甲
 for(const s of [-1,1]){
  const sh=ball(body,'shoulder armor',p.shoulder*.20,mats.armor);
  sh.position.set(s*p.shoulder*.48,shoulderY-.08,0);

  const trim=ball(body,'gold shoulder detail',p.shoulder*.12,mats.gold);
  trim.position.set(s*p.shoulder*.48,shoulderY-.02,.08);
 }

 // 手臂
 parts.arms={};
 for(const s of [-1,1]){
  const group=new THREE.Group();
  group.name=s===1?'right arm':'left arm';
  body.add(group);

  const upper=bone(group,'upper arm',.105,.085,mats.robe2);
  const elbow=ball(group,'elbow',.09,mats.skin);
  const lower=bone(group,'forearm',.08,.065,mats.armor);
  const wrist=ball(group,'wrist',.065,mats.skin);
  const hand=ball(group,'hand',.09,mats.skin);

  const bracer=mesh(group,
   new THREE.CylinderGeometry(.09,.075,.23,12),
   mats.gold,'arm guard');

  parts.arms[s]={upper,elbow,lower,wrist,hand,bracer};
 }

 // 腿部
 parts.legs={};
 for(const s of [-1,1]){
  const group=new THREE.Group();
  body.add(group);

  const thigh=bone(group,'thigh',.14,.11,mats.pants);
  const knee=ball(group,'knee',.105,mats.armor);
  const shin=bone(group,'shin',.105,.075,mats.pants);
  const ankle=ball(group,'ankle',.07,mats.skin);
  const boot=box(group,'boot',.19,.15,.33,mats.boot);
  const bootTop=box(group,'boot decoration',.19,.055,.19,mats.gold);

  parts.legs[s]={thigh,knee,shin,ankle,boot,bootTop};
 }

 // 披风
 const cape=mesh(body,
  new THREE.PlaneGeometry(p.shoulder*1.5,p.torso*1.4,8,8),
  new THREE.MeshStandardMaterial({
   color:0x101d34,side:THREE.DoubleSide
  }),'cape');
 cape.position.set(0,shoulderY-p.torso*.6,-.24);
 cape.rotation.x=.08;
 parts.cape=cape;

 // 剑鞘
 const sheath=box(body,'sword sheath',.11,p.torso*1.1,.11,mats.boot);
 sheath.position.set(p.shoulder*.75,shoulderY-p.torso*.5,-.25);
 sheath.rotation.z=-.28;

 const sword=new THREE.Group();
 sword.name='sword';
 body.add(sword);
 parts.sword=sword;

 const handle=bone(sword,'sword handle',.035,.035,mats.boot);
 connect(handle,[.5,shoulderY*.85,.04],[.5,shoulderY*.85+.35,.04]);

 const blade=box(sword,'blade',.065,p.torso*1.35,.025,mats.sword);
 blade.position.set(.5,shoulderY*.85-.45,.04);

 const guard=box(sword,'guard',.26,.045,.08,mats.gold);
 guard.position.set(.5,shoulderY*.85,.04);

 root.userData={parts,proportions:p};
 return root;
}

// MediaPipe世界坐标转为Three.js坐标
function convertLandmarks(world){
 const hip=(world[23].y+world[24].y)/2;
 const hipX=(world[23].x+world[24].x)/2;
 const hipZ=(world[23].z+world[24].z)/2;

 return world.map(p=>V(
  p.x-hipX,
  -(p.y-hip),
  -(p.z-hipZ)
 ));
}

// 计算两点间距离
function distance(a,b){
 return a.distanceTo(b);
}

// 从人体关键点计算比例
function measureBody(world){
 const p=convertLandmarks(world);

 const midpoint=(a,b)=>p[a].clone().add(p[b]).multiplyScalar(.5);

 const shoulder=midpoint(11,12);
 const hip=midpoint(23,24);
 const ankle=midpoint(27,28);
 const nose=p[0];

 const bodyHeight=distance(nose,ankle);

 const shoulderWidth=distance(p[11],p[12]);
 const hipWidth=distance(p[23],p[24]);

 const torso=distance(shoulder,hip);
 const upperArm=(distance(p[11],p[13])+distance(p[12],p[14]))/2;
 const forearm=(distance(p[13],p[15])+distance(p[14],p[16]))/2;
 const thigh=(distance(p[23],p[25])+distance(p[24],p[26]))/2;
 const shin=(distance(p[25],p[27])+distance(p[26],p[28]))/2;
 const head=distance(nose,shoulder)*.62;

 const safe=(v,min,max)=>THREE.MathUtils.clamp(v,min,max);

 // 统一到游戏人物身高，保留各部位之间的相对比例
 const targetHeight=3.6;
 const scale=targetHeight/Math.max(bodyHeight,.3);

 return {
  height:targetHeight,
  shoulder:safe(shoulderWidth*scale,.34,.85),
  hip:safe(hipWidth*scale,.24,.68),
  torso:safe(torso*scale,.55,1.2),
  upperArm:safe(upperArm*scale,.30,.72),
  forearm:safe(forearm*scale,.28,.68),
  thigh:safe(thigh*scale,.36,.82),
  shin:safe(shin*scale,.32,.82),
  head:safe(head*scale,.17,.32),
  measuredHeight:bodyHeight,
  raw:p
 };
}

function updateCharacterPose(measurements,screenLm){
 if(!character||!measurements)return;

 const u=character.userData.parts;
 const p=measurements.raw;

 // 用髋部作为角色的身体原点
 const h=p[23].clone().add(p[24]).multiplyScalar(.5);
 const targetHeight=3.6;
 const scale=targetHeight/Math.max(
  distance(p[0],p[27].clone().add(p[28]).multiplyScalar(.5)),.3
 );

 // 将世界关键点映射到人物局部坐标
 const point=i=>{
  const v=p[i].clone().sub(h).multiplyScalar(scale);
  return [v.x,v.y,v.z];
 };

 const ls=point(11),rs=point(12);
 const le=point(13),re=point(14);
 const lw=point(15),rw=point(16);
 const lh=point(23),rh=point(24);
 const lk=point(25),rk=point(26);
 const la=point(27),ra=point(28);

 // 让脚底靠近地面
 const floorY=Math.min(la[1],ra[1]);
 const adjust=a=>[a[0],a[1]-floorY,a[2]];

 const Ls=adjust(ls),Rs=adjust(rs);
 const Le=adjust(le),Re=adjust(re);
 const Lw=adjust(lw),Rw=adjust(rw);
 const Lh=adjust(lh),Rh=adjust(rh);
 const Lk=adjust(lk),Rk=adjust(rk);
 const La=adjust(la),Ra=adjust(ra);

 const mid=(a,b)=>[
  (a[0]+b[0])/2,
  (a[1]+b[1])/2,
  (a[2]+b[2])/2
 ];

 const centerShoulder=mid(Ls,Rs);
 const centerHip=mid(Lh,Rh);

 // 躯干随实际肩部和髋部位置变化
 const torsoCenter=mid(centerShoulder,centerHip);
 u.body.position.set(0,0,0);
 u.body.rotation.z=Math.atan2(
  Rs[1]-Ls[1],Rs[0]-Ls[0]
 )*.35;

 // 根据肩宽和躯干长度实时调整衣服尺寸
 const shoulderWidth=distance(
  V(...Ls),V(...Rs)
 );
 const torsoLength=distance(
  V(...centerShoulder),V(...centerHip)
 );

 const torsoMesh=u.body.getObjectByName('torso');
 torsoMesh.scale.x=THREE.MathUtils.lerp(
  torsoMesh.scale.x,
  shoulderWidth/Math.max(measurements.shoulder,.01),.15
 );

 // 更新头颈位置
 const headY=centerShoulder[1]+measurements.head*1.2;
 u.head.position.set(centerShoulder[0],headY,centerShoulder[2]);
 u.hair.position.set(centerShoulder[0],headY+measurements.head*.3,centerShoulder[2]-.025);
 u.bun.position.set(centerShoulder[0],headY+measurements.head*.92,centerShoulder[2]-.05);

 connect(u.neck,
  [centerShoulder[0],centerShoulder[1],centerShoulder[2]],
  [centerShoulder[0],headY-measurements.head*.7,centerShoulder[2]]
 );

 // 上下臂
 function arm(side,s,e,w){
  const a=u.arms[side];
  connect(a.upper,s,e,.9,.9);
  a.elbow.position.set(...e);
  connect(a.lower,e,w,.8,.8);
  a.wrist.position.set(...w);
  a.hand.position.set(w[0],w[1]-.08,w[2]);
  a.bracer.position.set(
   (e[0]+w[0])/2,(e[1]+w[1])/2,(e[2]+w[2])/2
  );
  a.bracer.scale.y=distance(V(...e),V(...w))*.35;
 }
 arm(-1,Ls,Le,Lw);
 arm(1,Rs,Re,Rw);

 // 双腿
 function leg(side,h,k,a){
  const part=u.legs[side];
  connect(part.thigh,h,k,.95,.95);
  part.knee.position.set(...k);
  connect(part.shin,k,a,.85,.85);
  part.ankle.position.set(...a);
  part.boot.position.set(a[0],a[1]-.07,a[2]+.07);
  part.bootTop.position.set(a[0],a[1]+.035,a[2]);
 }
 leg(-1,Lh,Lk,La);
 leg(1,Rh,Rk,Ra);

 // 让人物根据画面中的位置左右移动
 if(screenLm){
  const hipScreen=(screenLm[23].x+screenLm[24].x)/2;
  character.position.x=THREE.MathUtils.lerp(
   character.position.x,(.5-hipScreen)*2.1,.15
  );
 }

 // 身体朝向估计
 const shoulderAngle=Math.atan2(
  Rs[2]-Ls[2],Rs[0]-Ls[0]
 );
 character.rotation.y=THREE.MathUtils.lerp(
  character.rotation.y,shoulderAngle*.25,.12
 );
}

// 生成测量结果后，重新生成整个模型
function rebuildCharacter(p){
 const old=character;
 const pos=old?old.position.clone():V();
 const rot=old?old.rotation.clone():new THREE.Euler();

 character=buildCharacter(p);
 character.position.copy(pos);
 character.rotation.copy(rot);

 if(old){
  scene.remove(old);
  old.traverse(o=>{
   if(o.isMesh){
    o.geometry.dispose();
   }
  });
 }
 scene.add(character);
 calibrated=true;
}

// 骨架可视化
const links=[
 [11,12],[11,13],[13,15],[12,14],[14,16],
 [11,23],[12,24],[23,24],
 [23,25],[25,27],[24,26],[26,28],
 [0,11],[0,12]
];

function drawSkeleton(lm){
 const w=canvas.width=canvas.clientWidth*devicePixelRatio;
 const h=canvas.height=canvas.clientHeight*devicePixelRatio;
 ctx.clearRect(0,0,w,h);
 if(!lm)return;

 ctx.strokeStyle='#55dcff';
 ctx.lineWidth=2*devicePixelRatio;
 for(const [a,b] of links){
  ctx.beginPath();
  ctx.moveTo(lm[a].x*w,lm[a].y*h);
  ctx.lineTo(lm[b].x*w,lm[b].y*h);
  ctx.stroke();
 }
 ctx.fillStyle='#fff';
 for(const i of [0,11,12,13,14,15,16,23,24,25,26,27,28]){
  ctx.beginPath();
  ctx.arc(lm[i].x*w,lm[i].y*h,3*devicePixelRatio,0,Math.PI*2);
  ctx.fill();
 }
}

function showMeasurements(p){
 $('measure').innerHTML=
 `<b>身体测量数据</b><br>
 肩宽：${p.shoulder.toFixed(2)}<br>
 胯宽：${p.hip.toFixed(2)}<br>
 躯干：${p.torso.toFixed(2)}<br>
 上臂：${p.upperArm.toFixed(2)}<br>
 前臂：${p.forearm.toFixed(2)}<br>
 大腿：${p.thigh.toFixed(2)}<br>
 小腿：${p.shin.toFixed(2)}<br>
 头部：${p.head.toFixed(2)}<br>
 身高基准：3.60`;
}

async function setupLandmarker(){
 status.textContent='正在加载 AI 姿态识别模型……';

 const vision=await FilesetResolver.forVisionTasks(
  'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
 );

 landmarker=await PoseLandmarker.createFromOptions(
  vision,{
   baseOptions:{
    modelAssetPath:
    'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task',
    delegate:'GPU'
   },
   runningMode:'VIDEO',
   numPoses:1,
   minPoseDetectionConfidence:.55,
   minTrackingConfidence:.55
  }
 );
}

async function start(){
 try{
  if(running)return;

  status.textContent='正在打开摄像头……';

  stream=await navigator.mediaDevices.getUserMedia({
   audio:false,
   video:{
    facingMode:'user',
    width:{ideal:1280},
    height:{ideal:720}
   }
  });

  video.srcObject=stream;
  await video.play();

  if(!landmarker)await setupLandmarker();

  running=true;
  lastTime=-1;
  status.textContent='识别中：请完整站在摄像头前';
  loop();

 }catch(e){
  console.error(e);
  status.textContent='启动失败：'+e.message;
 }
}

function loop(){
 if(!running)return;

 if(video.readyState>=2&&video.currentTime!==lastTime){
  lastTime=video.currentTime;

  const result=landmarker.detectForVideo(
   video,performance.now()
  );

  if(result.landmarks?.length){
   const lm=result.landmarks[0];
   const world=result.worldLandmarks?.[0];

   drawSkeleton(lm);
   currentPose=lm;

   if(world){
    const now=performance.now();

    // 每隔一段时间重新测量，避免人物比例因抖动频繁变化
    if(!proportions||!calibrated){
     proportions=measureBody(world);
     rebuildCharacter(proportions);
     showMeasurements(proportions);
     status.textContent='人体测量完成，已生成对应人物';
     lastMeasureTime=now;
    }

    updateCharacterPose(proportions,lm);
   }

  }else{
   drawSkeleton(null);
   status.textContent='没有识别到完整人体，请调整站位';
  }
 }

 raf=requestAnimationFrame(loop);
}

function stop(){
 running=false;
 cancelAnimationFrame(raf);
 if(stream){
  stream.getTracks().forEach(t=>t.stop());
  stream=null;
 }
 video.srcObject=null;
 ctx.clearRect(0,0,canvas.width,canvas.height);
 status.textContent='摄像头已停止';
}

function reset(){
 if(character){
  character.position.set(0,0,0);
  character.rotation.set(0,0,0);
 }
 status.textContent='人物位置已重置';
}

function recalibrate(){
 calibrated=false;
 proportions=null;
 status.textContent='请保持全身出现在摄像头中，正在等待重新测量';
}

$('start').addEventListener('click',start);
$('stop').addEventListener('click',stop);
$('reset').addEventListener('click',reset);
$('rebuild').addEventListener('click',recalibrate);

window.addEventListener('resize',()=>{
 if(!camera||!renderer)return;
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

function animate(){
 requestAnimationFrame(animate);
 if(renderer&&scene&&camera)renderer.render(scene,camera);
}

initScene();
animate();
</script>
</body>
</html>
