<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D人物模型加载测试</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10131b;color:white;font-family:Arial}
#viewer{width:100%;height:100%;position:absolute;inset:0}
#status{position:fixed;z-index:10;top:15px;left:15px;padding:12px 16px;background:#202838;border-radius:10px;font-size:14px}
#file{position:fixed;z-index:10;bottom:20px;left:15px;right:15px;color:#aaa;font-size:12px}
</style>
</head>
<body>
<div id="viewer"></div>
<div id="status">正在初始化人物模型……</div>
<div id="file">模型文件：Sci-Fi Swordsman.ply</div>

<script type="module">
import * as GaussianSplats3D from
'https://esm.sh/@mkkellogg/gaussian-splats-3d';

const status = document.getElementById('status');

async function loadCharacter(){
  try {
    status.textContent = '正在加载 3D 人物模型……';

    const viewer = new GaussianSplats3D.Viewer({
      rootElement: document.getElementById('viewer'),
      cameraUp: [0, 1, 0],
      initialCameraPosition: [0, 1, 4],
      initialCameraLookAt: [0, 1, 0],
      gpuAcceleratedSort: true,
      sphericalHarmonicsDegree: 1,
      sceneRevealMode: GaussianSplats3D.SceneRevealMode.Instant
    });

    await viewer.addSplatScene(
      './Sci-Fi%20Swordsman.ply',
      {
        format: GaussianSplats3D.SceneFormat.Ply,
        splatAlphaRemovalThreshold: 1,
        showLoadingUI: true,
        position: [0, 0, 0],
        rotation: [0, 0, 0, 1],
        scale: [1, 1, 1]
      }
    );

    viewer.start();
    status.textContent = '人物模型加载成功！';

    window.characterViewer = viewer;

  } catch(error) {
    console.error('人物模型加载失败：', error);
    status.textContent = '加载失败：' + error.message;
  }
}

loadCharacter();
</script>
</body>
</html>
