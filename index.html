<body>

<header>

请保持身体、双手和面部在镜头内。建议使用光线充足的环境。

<script type="module">

import {
 FilesetResolver,
 PoseLandmarker,
 HandLandmarker,
 FaceLandmarker
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

/* ===============================
   1. 基础配置
================================ */

const video=document.getElementById("webcam");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const startBtn=document.getElementById("startBtn");
const stopBtn=document.getElementById("stopBtn");
const statusEl=document.getElementById("status");

let pose=null;
let hands=null;
let face=null;
let stream=null;

let running=false;
let raf=0;

let lastPoseTime=0;
let lastHandTime=0;
let lastFaceTime=0;

let poseData=null;
let handData=null;
let faceData=null;

let smoothFace=null;

let faceLastSeen=0;
let handLastSeen=0;
let poseLastSeen=0;

const CONFIG={
 poseInterval:65,
 handInterval:65,
 faceInterval:55,
 faceSmooth:0.38,
 faceHold:350,
 handHold:180,
 poseHold:180
};

const C={
 background:"#0a0e18",
 body:"#00e676",
 hand1:"#00d9ff",
 hand2:"#ff4fd8",
 face:"#b49aff",
 faceLight:"#e0d5ff",
 eyeWhite:"#f7fbff",
 iris:"#39baff",
 pupil:"#10182b",
 nose:"#d6b6ff",
 lip:"#f17da9",
 lipDark:"#69223f",
 ear:"#c6adff"
};

/* ===============================
   2. 画布尺寸及坐标
================================ */

function resizeCanvas(){
 const r=canvas.getBoundingClientRect();
 const dpr=Math.min(window.devicePixelRatio||1,2);

 canvas.width=Math.round(r.width*dpr);
 canvas.height=Math.round(r.height*dpr);

 ctx.setTransform(dpr,0,0,dpr,0,0);
}

new ResizeObserver(resizeCanvas).observe(canvas);
window.addEventListener("resize",resizeCanvas);
resizeCanvas();

/*
  根据视频实际比例进行坐标映射。
  防止摄像头和骨骼画面不一致。
*/

function P(lm){
 const cw=canvas.clientWidth;
 const ch=canvas.clientHeight;

 const vw=video.videoWidth||640;
 const vh=video.videoHeight||480;

 const scale=Math.min(cw/vw,ch/vh);
 const rw=vw*scale;
 const rh=vh*scale;

 const ox=(cw-rw)/2;
 const oy=(ch-rh)/2;

 return {
  x:ox+(1-lm.x)*rw,
  y:oy+lm.y*rh
 };
}

function clearCanvas(){
 ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);
 ctx.fillStyle=C.background;
 ctx.fillRect(0,0,canvas.clientWidth,canvas.clientHeight);
}

function line(a,b,color,width=2){
 ctx.beginPath();
 ctx.moveTo(a.x,a.y);
 ctx.lineTo(b.x,b.y);
 ctx.strokeStyle=color;
 ctx.lineWidth=width;
 ctx.lineCap="round";
 ctx.lineJoin="round";
 ctx.stroke();
}

function dot(p,r,color,fill=true){
 ctx.beginPath();
 ctx.arc(p.x,p.y,r,0,Math.PI*2);
 ctx.fillStyle=color;
 ctx.strokeStyle=color;
 ctx.lineWidth=1.4;
 if(fill)ctx.fill();
 else ctx.stroke();
}

function smoothPath(points,close=true){
 if(points.length<3)return;

 ctx.beginPath();

 const first=points[0];
 const last=points[points.length-1];

 ctx.moveTo(
  (last.x+first.x)/2,
  (last.y+first.y)/2
 );

 for(let i=0;i<points.length;i++){
  const a=points[i];
  const b=points[(i+1)%points.length];

  ctx.quadraticCurveTo(
   a.x,a.y,
   (a.x+b.x)/2,
   (a.y+b.y)/2
  );
 }

 if(close)ctx.closePath();
}

function drawLandmarkPath(lms,ids,color,width=2,close=false){
 const points=ids.map(i=>P(lms[i]));
 if(points.length<2)return;

 ctx.beginPath();
 ctx.moveTo(points[0].x,points[0].y);

 for(let i=1;i<points.length;i++){
  ctx.lineTo(points[i].x,points[i].y);
 }

 if(close)ctx.closePath();

 ctx.strokeStyle=color;
 ctx.lineWidth=width;
 ctx.lineCap="round";
 ctx.lineJoin="round";
 ctx.stroke();
}

/* ===============================
   3. 身体骨骼
================================ */

const BODY_LINKS=[
 [11,13],[13,15],
 [12,14],[14,16],
 [11,12],
 [11,23],[12,24],
 [23,24],
 [23,25],[25,27],
 [24,26],[26,28],
 [27,31],[28,32]
];

function drawBody(lms){
 if(!lms||lms.length<33)return;

 const scale=Math.max(2,canvas.clientWidth/280);

 ctx.save();

 ctx.shadowColor=C.body;
 ctx.shadowBlur=9;

 BODY_LINKS.forEach(([a,b])=>{
  if((lms[a].visibility??1)<.25)return;
  if((lms[b].visibility??1)<.25)return;

  line(P(lms[a]),P(lms[b]),C.body,scale);
 });

 ctx.shadowBlur=0;

 [11,12,13,14,15,16,23,24,25,26,27,28].forEach(i=>{
  if((lms[i].visibility??1)<.25)return;
  dot(P(lms[i]),scale*.65,"#ffffff");
 });

 if((lms[0].visibility??1)>.25){
  dot(P(lms[0]),scale*2,C.body);
 }

 ctx.restore();
}

/* ===============================
   4. 双手及五指
================================ */

const FINGERS=[
 [0,1,2,3,4],
 [0,5,6,7,8],
 [0,9,10,11,12],
 [0,13,14,15,16],
 [0,17,18,19,20]
];

const PALM=[
 [5,9],[9,13],[13,17],[5,17]
];

function drawHand(lms,color,index){
 if(!lms||lms.length!==21)return;

 const p=lms.map(P);
 const s=Math.max(2,canvas.clientWidth/300);

 ctx.save();

 // 手掌半透明区域
 ctx.beginPath();

 [0,1,5,9,13,17].forEach((id,i)=>{
  if(i===0)ctx.moveTo(p[id].x,p[id].y);
  else ctx.lineTo(p[id].x,p[id].y);
 });

 ctx.closePath();
 ctx.fillStyle=color+"18";
 ctx.fill();

 ctx.strokeStyle=color;
 ctx.lineWidth=s;
 ctx.stroke();

 // 手指
 FINGERS.forEach(f=>{
  for(let i=0;i<f.length-1;i++){
   line(
    p[f[i]],
    p[f[i+1]],
    color,
    s*(1.1-i*.1)
   );
  }
 });

 // 手掌横向连接
 PALM.forEach(([a,b])=>{
  line(p[a],p[b],color,s*.7);
 });

 // 21个关节点
 p.forEach((v,i)=>{
  const tip=[4,8,12,16,20].includes(i);
  dot(v,tip?s*.95:s*.55,tip?"#ffffff":color);
 });

 ctx.restore();
}

/* ===============================
   5. 面部关键点
================================ */

const FACE_OVAL=[
 10,338,297,332,284,251,389,356,454,
 323,361,288,397,365,379,378,400,377,
 152,148,176,149,150,136,172,58,132,
 93,234,127,162,21,54,103,67,109
];

const LEFT_EYE=[
 263,249,390,373,374,380,381,382,
 362,466,388,387,386,385,384,398
];

const RIGHT_EYE=[
 33,7,163,144,145,153,154,155,
 133,246,161,160,159,158,157,173
];

const LEFT_IRIS=[468,469,470,471,472];
const RIGHT_IRIS=[473,474,475,476,477];

const LIP_OUTER=[
 61,185,40,39,37,0,267,269,270,409,
 291,375,321,405,314,17,84,181,91,146
];

const LIP_INNER=[
 78,191,80,81,82,13,312,311,310,415,
 308,324,318,402,317,14,87,178,88,95
];

/* ===============================
   6. 面部轮廓
================================ */

function drawFaceOutline(lms){
 const pts=FACE_OVAL.map(i=>P(lms[i]));

 ctx.save();

 smoothPath(pts);

 // 柔和的面部底色
 const b=ctx.createLinearGradient(
  0,pts[0].y,0,pts[Math.floor(pts.length/2)].y
 );

 b.addColorStop(0,"rgba(160,140,255,0.08)");
 b.addColorStop(1,"rgba(160,140,255,0.015)");

 ctx.fillStyle=b;
 ctx.fill();

 ctx.strokeStyle=C.face;
 ctx.lineWidth=Math.max(2,canvas.clientWidth/500);
 ctx.lineJoin="round";
 ctx.stroke();

 ctx.restore();
}

/* ===============================
   7. 眼睛与眼神
================================ */

function drawEye(lms,ids,irisIds){
 const points=ids.map(i=>P(lms[i]));

 ctx.save();

 // 眼白
 smoothPath(points);

 ctx.fillStyle=C.eyeWhite;
 ctx.fill();

 ctx.strokeStyle="#a6b4d0";
 ctx.lineWidth=1.3;
 ctx.stroke();

 // 虹膜
 const center=P(lms[irisIds[0]]);
 const edge=P(lms[irisIds[1]]);

 const radius=Math.max(
  2,
  Math.hypot(
   edge.x-center.x,
   edge.y-center.y
  )*1.25
 );

 // 虹膜外圈
 ctx.beginPath();
 ctx.arc(center.x,center.y,radius,0,Math.PI*2);
 ctx.fillStyle=C.iris;
 ctx.fill();

 // 虹膜纹理
 ctx.strokeStyle="#b5ecff";
 ctx.lineWidth=.8;

 for(let i=0;i<8;i++){
  const angle=i*Math.PI/4;
  ctx.beginPath();
  ctx.moveTo(
   center.x+Math.cos(angle)*radius*.55,
   center.y+Math.sin(angle)*radius*.55
  );
  ctx.lineTo(
   center.x+Math.cos(angle)*radius*.88,
   center.y+Math.sin(angle)*radius*.88
  );
  ctx.stroke();
 }

 // 瞳孔
 ctx.beginPath();
 ctx.arc(
  center.x,center.y,
  radius*.48,0,Math.PI*2
 );
 ctx.fillStyle=C.pupil;
 ctx.fill();

 // 眼睛高光
 dot({
  x:center.x-radius*.3,
  y:center.y-radius*.3
 },Math.max(1,radius*.2),"#ffffff");

 // 上眼睑和下眼睑
 ctx.beginPath();
 ctx.moveTo(points[0].x,points[0].y);
 ctx.quadraticCurveTo(
  points[4].x,points[4].y,
  points[8].x,points[8].y
 );
 ctx.strokeStyle="#b49aff";
 ctx.lineWidth=2;
 ctx.stroke();

 ctx.restore();
}

/* ===============================
   8. 眉毛
================================ */

function drawEyebrows(lms){
 const brows=[
  [70,63,105,66,107],
  [336,296,334,293,300]
 ];

 brows.forEach(ids=>{
  const pts=ids.map(i=>P(lms[i]));

  ctx.beginPath();
  ctx.moveTo(pts[0].x,pts[0].y);

  for(let i=1;i<pts.length;i++){
   ctx.lineTo(pts[i].x,pts[i].y);
  }

  ctx.strokeStyle="#d0bcff";
  ctx.lineWidth=3;
  ctx.lineCap="round";
  ctx.stroke();
 });
}

/* ===============================
   9. 鼻子
================================ */

function drawNose(lms){
 ctx.save();

 const bridge=[168,6,197,195,5,4];

 const pts=bridge.map(i=>P(lms[i]));

 ctx.beginPath();
 ctx.moveTo(pts[0].x,pts[0].y);

 pts.slice(1).forEach(p=>{
  ctx.lineTo(p.x,p.y);
 });

 ctx.strokeStyle=C.nose;
 ctx.lineWidth=2.3;
 ctx.lineCap="round";
 ctx.stroke();

 const tip=P(lms[1]);
 const left=P(lms[98]);
 const right=P(lms[327]);

 ctx.beginPath();
 ctx.moveTo(left.x,left.y);
 ctx.quadraticCurveTo(
  tip.x,tip.y+4,
  right.x,right.y
 );

 ctx.strokeStyle="#f3c6df";
 ctx.lineWidth=2;
 ctx.stroke();

 dot(tip,2.2,"#f1c7ff");

 ctx.restore();
}

/* ===============================
   10. 嘴巴和嘴唇
================================ */

function drawMouth(lms){
 ctx.save();

 const outer=LIP_OUTER.map(i=>P(lms[i]));
 const inner=LIP_INNER.map(i=>P(lms[i]));

 // 外嘴唇
 smoothPath(outer);

 const gradient=ctx.createLinearGradient(
  0,outer[0].y-10,
  0,outer[0].y+25
 );

 gradient.addColorStop(0,"#ffadc7");
 gradient.addColorStop(1,"#e75c91");

 ctx.fillStyle=gradient;
 ctx.fill();

 ctx.strokeStyle="#f17da9";
 ctx.lineWidth=1.7;
 ctx.stroke();

 // 嘴巴内部
 smoothPath(inner);
 ctx.fillStyle="#61203d";
 ctx.fill();

 // 唇部中线
 const upper=P(lms[13]);
 const lower=P(lms[14]);

 ctx.beginPath();
 ctx.moveTo(upper.x,upper.y);
 ctx.quadraticCurveTo(
  (upper.x+lower.x)/2,
  (upper.y+lower.y)/2,
  lower.x,lower.y
 );

 ctx.strokeStyle="#ffb3d0";
 ctx.lineWidth=1;
 ctx.stroke();

 ctx.restore();
}

/* ===============================
   11. 耳朵
================================ */

function drawEars(lms){
 ctx.save();

 const left=P(lms[234]);
 const right=P(lms[454]);

 const faceWidth=Math.abs(right.x-left.x);

 const rx=Math.max(4,faceWidth*.045);
 const ry=Math.max(7,faceWidth*.085);

 [left,right].forEach((p,i)=>{
  const dir=i===0?-1:1;

  ctx.beginPath();
  ctx.ellipse(
   p.x+dir*rx*.35,
   p.y+ry*.12,
   rx,ry,0,0,Math.PI*2
  );

  ctx.fillStyle="#171c32";
  ctx.strokeStyle=C.ear;
  ctx.lineWidth=2;
  ctx.fill();
  ctx.stroke();

  // 耳廓内部
  ctx.beginPath();
  ctx.ellipse(
   p.x+dir*rx*.35,
   p.y+ry*.12,
   rx*.4,ry*.55,0,0,Math.PI*2
  );

  ctx.strokeStyle="#e0d2ff";
  ctx.lineWidth=1;
  ctx.stroke();
 });

 ctx.restore();
}

/* ===============================
   12. 完整面部
================================ */

function drawFace(lms){
 if(!lms||lms.length<478)return;

 ctx.save();

 drawFaceOutline(lms);
 drawEars(lms);
 drawEyebrows(lms);

 drawEye(lms,LEFT_EYE,LEFT_IRIS);
 drawEye(lms,RIGHT_EYE,RIGHT_IRIS);

 drawNose(lms);
 drawMouth(lms);

 ctx.restore();
}

/* ===============================
   13. 面部平滑处理
================================ */

function stabilizeFace(current){
 if(!current)return smoothFace;

 if(!smoothFace||smoothFace.length!==current.length){
  smoothFace=current.map(p=>({
   x:p.x,y:p.y,z:p.z||0
  }));
  return smoothFace;
 }

 const factor=CONFIG.faceSmooth;

 for(let i=0;i<current.length;i++){
  smoothFace[i].x+=(current[i].x-smoothFace[i].x)*factor;
  smoothFace[i].y+=(current[i].y-smoothFace[i].y)*factor;
  smoothFace[i].z+=((current[i].z||0)-smoothFace[i].z)*factor;
 }

 return smoothFace;
}

/* ===============================
   14. 模型初始化
================================ */

async function loadModels(){
 statusEl.textContent="正在加载 AI 模型...";

 const vision=await FilesetResolver.forVisionTasks(
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
 );

 async function createAll(delegate){
  const common={
   runningMode:"VIDEO"
  };

  const p=await PoseLandmarker.createFromOptions(vision,{
   ...common,
   baseOptions:{
    modelAssetPath:
    "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
    delegate
   },
   numPoses:1,
   minPoseDetectionConfidence:.5,
   minPosePresenceConfidence:.5,
   minTrackingConfidence:.5
  });

  const h=await HandLandmarker.createFromOptions(vision,{
   ...common,
   baseOptions:{
    modelAssetPath:
    "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
    delegate
   },
   numHands:2,
   minHandDetectionConfidence:.5,
   minHandPresenceConfidence:.5,
   minTrackingConfidence:.5
  });

  const f=await FaceLandmarker.createFromOptions(vision,{
   ...common,
   baseOptions:{
    modelAssetPath:
    "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
    delegate
   },
   numFaces:1,
   minFaceDetectionConfidence:.55,
   minFacePresenceConfidence:.55,
   minTrackingConfidence:.5,
   outputFaceBlendshapes:true,
   outputFacialTransformationMatrixes:true
  });

  return {p,h,f};
 }

 try{
  const models=await createAll("GPU");
  pose=models.p;
  hands=models.h;
  face=models.f;
 }catch(gpuError){
  console.warn("GPU初始化失败，切换CPU",gpuError);

  [pose,hands,face].forEach(m=>{
   if(m){
    try{m.close()}catch(e){}
   }
  });

  pose=hands=face=null;

  const models=await createAll("CPU");
  pose=models.p;
  hands=models.h;
  face=models.f;
 }

 statusEl.textContent="身体、双手、面部模型加载完成";
}

/* ===============================
   15. 独立检测频率
================================ */

function detectModels(now){
 if(video.readyState<2)return;

 try{
  if(now-lastPoseTime>=CONFIG.poseInterval){
   lastPoseTime=now;

   const result=pose.detectForVideo(video,now);

   if(result.landmarks&&result.landmarks.length){
    poseData=result.landmarks[0];
    poseLastSeen=now;
   }
  }

  if(now-lastHandTime>=CONFIG.handInterval){
   lastHandTime=now;

   const result=hands.detectForVideo(video,now);

   if(result.landmarks&&result.landmarks.length){
    handData=result.landmarks;
    handLastSeen=now;
   }else if(now-handLastSeen>CONFIG.handHold){
    handData=null;
   }
  }

  if(now-lastFaceTime>=CONFIG.faceInterval){
   lastFaceTime=now;

   const result=face.detectForVideo(video,now);

   if(result.faceLandmarks&&result.faceLandmarks.length){
    faceData=stabilizeFace(result.faceLandmarks[0]);
    faceLastSeen=now;
   }
  }

 }catch(e){
  console.error("模型检测错误:",e);
 }
}

/* ===============================
   16. 绘制及状态
================================ */

function render(){
 if(!running)return;

 const now=performance.now();

 if(video.readyState>=2){
  detectModels(now);
  clearCanvas();

  if(poseData&&now-poseLastSeen<CONFIG.poseHold){
   drawBody(poseData);
  }

  if(handData&&now-handLastSeen<CONFIG.handHold){
   handData.forEach((h,i)=>{
    drawHand(h,i===0?C.hand1:C.hand2,i);
   });
  }

  if(faceData&&now-faceLastSeen<CONFIG.faceHold){
   drawFace(faceData);
  }

  const faceOK=faceData&&now-faceLastSeen<CONFIG.faceHold;
  const handOK=handData&&now-handLastSeen<CONFIG.handHold;
  const bodyOK=poseData&&now-poseLastSeen<CONFIG.poseHold;

  statusEl.textContent=
   `身体 ${bodyOK?"✓":"搜索中"} | 双手 ${handOK?"✓":"搜索中"} | 面部 ${faceOK?"✓":"搜索中"}`;
 }

 raf=requestAnimationFrame(render);
}

/* ===============================
   17. 摄像头
================================ */

async function startCamera(){
 try{
  startBtn.disabled=true;
  statusEl.textContent="正在启动摄像头...";

  if(!pose||!hands||!face){
   await loadModels();
  }

  stream=await navigator.mediaDevices.getUserMedia({
   video:{
    facingMode:"user",
    width:{ideal:1280},
    height:{ideal:720},
    frameRate:{ideal:30,max:30}
   },
   audio:false
  });

  video.srcObject=stream;
  await video.play();

  await new Promise(resolve=>{
   if(video.videoWidth>0)resolve();
   else video.onloadedmetadata=resolve;
  });

  resizeCanvas();

  running=true;

  poseData=null;
  handData=null;
  faceData=null;
  smoothFace=null;

  lastPoseTime=0;
  lastHandTime=0;
  lastFaceTime=0;

  stopBtn.disabled=false;

  statusEl.textContent="摄像头启动成功，正在识别...";
  render();

 }catch(e){
  console.error(e);

  startBtn.disabled=false;

  statusEl.textContent=
   "启动失败："+(e.message||e.name);
 }
}

/* ===============================
   18. 停止与清理
================================ */

function stopCamera(){
 running=false;
 cancelAnimationFrame(raf);

 if(stream){
  stream.getTracks().forEach(t=>t.stop());
  stream=null;
 }

 video.srcObject=null;

 [pose,hands,face].forEach(m=>{
  if(m){
   try{m.close()}catch(e){}
  }
 });

 pose=null;
 hands=null;
 face=null;

 poseData=null;
 handData=null;
 faceData=null;
 smoothFace=null;

 clearCanvas();

 startBtn.disabled=false;
 stopBtn.disabled=true;

 statusEl.textContent="已经停止";
}

startBtn.addEventListener("click",startCamera);
stopBtn.addEventListener("click",stopCamera);

/* 页面初始化 */

loadModels().catch(e=>{
 console.error(e);
 statusEl.textContent="模型加载失败，请检查网络";
});

</script>
</body>
</html>
