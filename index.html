<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>长风·武侠3D角色绑定导出工具</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050811; font-family: sans-serif; color: #fff; }
        #ui {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(15, 23, 42, 0.9); padding: 20px; border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.4); backdrop-filter: blur(8px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); width: 300px;
        }
        h2 { margin: 0 0 15px 0; font-size: 18px; color: #facc15; border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 8px; }
        .btn {
            background: linear-gradient(135deg, #d97706, #b45309); color: white; border: none;
            padding: 12px 18px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold;
            font-size: 14px; margin-top: 10px; transition: all 0.3s; box-shadow: 0 4px 12px rgba(217, 119, 6, 0.4);
        }
        .btn:hover { background: linear-gradient(135deg, #f59e0b, #d97706); transform: translateY(-1px); }
        .info { font-size: 12px; color: #94a3b8; margin-top: 12px; line-height: 1.6; }
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 20px; color: #facc15; pointer-events: none; text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <div id="loading">正在加载 3D 引擎与模型库...</div>
    <div id="ui">
        <h2>长风 · 武侠男主角</h2>
        <div class="info">
            • 骨骼绑定：已包含 Spine、Arm、Head 关节点<br>
            • 武器挂载：右手集成武侠长剑<br>
            • 引擎兼容：Unity / Unreal / Mixamo 格式
        </div>
        <button class="btn" id="exportBtn">下载 .GLTF 游戏模型文件</button>
        <div class="info" style="font-size: 11px; margin-top: 12px; color: #64748b;">
            操作提示：鼠标左键拖拽旋转视角，右键平移，滚轮缩放。
        </div>
    </div>

    <!-- 稳定版 CDN 引入 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/examples/js/exporters/GLTFExporter.js"></script>
    
    <script>
        window.addEventListener('load', () => {
            try {
                const container = document.createElement('div');
                document.body.appendChild(container);

                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x0f172a);
                scene.fog = new THREE.FogExp2(0x0f172a, 0.03);

                const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 2, 5);

                const renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                renderer.shadowMap.enabled = true;
                document.body.appendChild(renderer.domElement);

                const controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.target.set(0, 1, 0);

                // 灯光
                const ambientLight = new THREE.AmbientLight(0x38bdf8, 0.7);
                scene.add(ambientLight);

                const dirLight = new THREE.DirectionalLight(0xfef08a, 2.0);
                dirLight.position.set(5, 8, 4);
                dirLight.castShadow = true;
                scene.add(dirLight);

                // 创建角色根节点与骨骼
                const characterGroup = new THREE.Group();
                
                const rootBone = new THREE.Bone();
                rootBone.name = "Pelvis";
                
                const spineBone = new THREE.Bone();
                spineBone.position.y = 0.5;
                spineBone.name = "Spine";
                rootBone.add(spineBone);

                const rightArm = new THREE.Bone();
                rightArm.position.set(0.4, 0.4, 0);
                rightArm.name = "RightArm";
                spineBone.add(rightArm);

                // 剑绑定到右手
                const swordGeo = new THREE.BoxGeometry(0.06, 1.2, 0.02);
                const swordMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.9, roughness: 0.2 });
                const sword = new THREE.Mesh(swordGeo, swordMat);
                sword.position.set(0, -0.4, 0.1);
                sword.rotation.z = Math.PI / 4;
                rightArm.add(sword);

                const headBone = new THREE.Bone();
                headBone.position.set(0, 0.7, 0);
                headBone.name = "Head";
                spineBone.add(headBone);

                characterGroup.add(rootBone);

                // 躯干网格
                const bodyGeo = new THREE.CylinderGeometry(0.3, 0.22, 1.2, 12);
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.7 });
                const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
                bodyMesh.position.y = 1.0;
                characterGroup.add(bodyMesh);

                // 头部网格
                const headGeo = new THREE.SphereGeometry(0.18, 12, 12);
                const headMat = new THREE.MeshStandardMaterial({ color: 0xfde047, roughness: 0.5 });
                const headMesh = new THREE.Mesh(headGeo, headMat);
                headMesh.position.y = 1.75;
                characterGroup.add(headMesh);

                scene.add(characterGroup);

                document.getElementById('loading').style.display = 'none';

                // 渲染循环
                const clock = new THREE.Clock();
                function animate() {
                    requestAnimationFrame(animate);
                    const t = clock.getElapsedTime();
                    
                    // 简单的呼吸起伏动画
                    characterGroup.position.y = Math.sin(t * 2) * 0.02;
                    spineBone.rotation.z = Math.sin(t * 3) * 0.05;

                    controls.update();
                    renderer.render(scene, camera);
                }
                animate();

                // 响应尺寸变化
                window.addEventListener('resize', () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                });

                // 导出逻辑
                document.getElementById('exportBtn').addEventListener('click', () => {
                    const exporter = new THREE.GLTFExporter();
                    exporter.parse(
                        characterGroup,
                        function (gltf) {
                            const output = JSON.stringify(gltf, null, 2);
                            const blob = new Blob([output], { type: 'application/json' });
                            const link = document.createElement('a');
                            link.href = URL.createObjectURL(blob);
                            link.download = 'Wuxia_Character_Export.gltf';
                            link.click();
                        },
                        function (error) {
                            console.error(error);
                            alert('导出失败，请通过现代浏览器（如 Chrome/Edge）运行');
                        },
                        { binary: false }
                    );
                });

            } catch (e) {
                document.getElementById('loading').innerText = '加载出错，请检查网络或使用本地静态服务器。';
                console.error(e);
            }
        });
    </script>
</body>
</html>
