<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Air Piano - 空中绘画钢琴 V2.1</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#0a0c12;color:white;
  font-family:Arial,"Microsoft YaHei",sans-serif;
  overflow:hidden;
}
button,select{cursor:pointer}
.app{height:100dvh;display:flex;flex-direction:column;padding:10px;gap:9px}
header{height:48px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo{font-size:19px;font-weight:bold;letter-spacing:1px}
.logo span{color:#39ff14;text-shadow:0 0 12px #39ff14}
.status{font-size:12px;color:#39ff14}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:10px}
.cameraPanel,.sidePanel{background:#12151f;border:1px solid #2a3142;border-radius:14px;overflow:hidden}
.cameraPanel{display:flex;flex-direction:column;min-width:0}
.panelTitle{padding:10px 13px;font-size:13px;border-bottom:1px solid #2a3142;display:flex;justify-content:space-between;align-items:center}
.stage{position:relative;flex:1;min-height:0;background:#05060a;overflow:hidden}
video,#canvas{position:absolute;width:100%;height:100%;inset:0;object-fit:cover}
video{transform:scaleX(-1)}
#canvas{pointer-events:none}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#8a93a8;padding:20px;line-height:2}
.empty strong{display:block;color:white;font-size:18px}
.stage.started .empty{display:none}
.tools{display:flex;flex-wrap:wrap;gap:7px;padding:10px;border-top:1px solid #2a3142}
button,select{
  background:#252b3a;color:white;border:1px solid #3d465c;
  border-radius:8px;padding:10px 12px;font-size:12px
}
button.primary{background:#39ff14;color:#0a0f08;border-color:#39ff14;font-weight:bold;box-shadow:0 0 14px rgba(57,255,20,.35)}
button.pink{background:#3a1835;border-color:#e040a0;color:#ff7ecb}
button:active{transform:scale(.97)}
.sidePanel{padding:12px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.section{background:#0d1018;border:1px solid #2a3142;border-radius:10px;padding:11px}
.section h3{font-size:13px;margin:0 0 10px;color:#c8d0e0}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.modes button.active{background:#39ff14;color:#0a0f08;box-shadow:0 0 10px rgba(57,255,20,.3)}
.description{font-size:11px;color:#8a93a8;line-height:1.7;margin-top:9px}
.piano{height:300px;display:flex;gap:7px}
.pitchLabels{display:flex;flex-direction:column;justify-content:space-between;color:#7a8499;font-size:10px}
.keyboard{position:relative;flex:1;display:flex;overflow:hidden;border:1px solid #3d465c;border-radius:5px;background:#07090e}
.whites{display:flex;width:100%}
.white{flex:1;background:linear-gradient(90deg,#ddd,#fff,#d5d9e2);border-right:1px solid #aaa}
.white.active{background:#39ff14;box-shadow:0 0 20px #39ff14}
.blacks{position:absolute;inset:0 0 auto;height:60%;pointer-events:none}
.black{position:absolute;width:7%;height:100%;background:linear-gradient(90deg,#08090c,#343946,#08090c);border-radius:0 0 4px 4px}
.black.active{background:#ff39ce;box-shadow:0 0 18px #ff39ce}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.stat{background:#1a2030;padding:9px;border-radius:7px}
.stat small{display:block;color:#7a8499;font-size:10px}
.stat b{display:block;font-size:17px;margin-top:5px}
.colorList{display:grid;grid-template-columns:1fr 1fr;gap:7px;font-size:10px;color:#b0b8c8}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.progress{height:4px;background:#2a3142;margin-top:9px;border-radius:5px;overflow:hidden}
.progress div{height:100%;width:0;background:linear-gradient(90deg,#ff39ce,#ff7ecb);box-shadow:0 0 8px #ff39ce}
footer{font-size:10px;color:#5a6478;text-align:center;flex-shrink:0}
body.fullscreen .app{padding:5px}
body.fullscreen .main{grid-template-columns:minmax(0,1fr) 260px}
body.fullscreen .stage{min-height:0}
@media(max-width:750px){
  .app{padding:6px;gap:6px}
  header{height:38px}
  .main{grid-template-columns:minmax(0,1fr) 115px;gap:6px}
  .sidePanel{padding:6px;gap:7px}
  .section{padding:7px}
  .piano{height:230px}
  .pitchLabels{font-size:8px}
  .section h3{font-size:11px}
  .description{font-size:9px}
  .modes{grid-template-columns:1fr}
  .modes button{padding:7px 3px;font-size:10px}
  .tools{padding:6px;gap:5px}
  button,select{padding:9px 7px;font-size:10px}
  .colorList{grid-template-columns:1fr}
}
@media(max-width:480px){
  .main{grid-template-columns:minmax(0,1fr) 98px}
  .piano{height:190px}
  .stat{padding:5px}
  .stat b{font-size:12px}
  .status{font-size:9px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo">♫ AIR <span>PIANO</span> V2.1</div>
  <div class="status" id="status">● 摄像头未启动</div>
</header>

<div class="main">
<section class="cameraPanel">
  <div class="panelTitle">
   <b>实时手势画布</b>
   <span id="fps">等待摄像头</span>
  </div>
  <div class="stage" id="stage">
   <video id="video" autoplay muted playsinline></video>
   <canvas id="canvas"></canvas>
   <div class="empty">
    <div>
     <div style="font-size:45px">◎</div>
     <strong>空中绘画钢琴</strong>
     请启动摄像头<br>
     伸出手指，在空气中绘制旋律
    </div>
   </div>
  </div>
  <div class="tools">
   <button class="primary" id="cameraBtn">启动摄像头</button>
   <button class="pink" id="startBtn" disabled>▶ 开始</button>
   <button id="playBtn">▶ 回放</button>
   <button id="clearBtn">清空</button>
   <button id="fullscreenBtn">⛶ 全屏</button>
   <select id="scale">
    <option value="C">C大调</option>
    <option value="G">G大调</option>
    <option value="A">A小调</option>
    <option value="P" selected>五声音阶</option>
    <option value="Cm">C小调五声</option>
    <option value="all">全部半音</option>
   </select>
  </div>
</section>

<aside class="sidePanel">
  <div class="section">
   <h3>演奏模式</h3>
   <div class="modes">
    <button class="active" id="liveMode">实时演奏</button>
    <button id="drawMode">绘画后播放</button>
   </div>
   <div class="description" id="modeText">
    先启动摄像头，再点击「开始」，伸出手指即可演奏。
   </div>
   <div class="progress"><div id="progress"></div></div>
  </div>

  <div class="section">
   <h3>钢琴音域</h3>
   <div class="piano">
    <div class="pitchLabels">
     <span>C6</span><span>A5</span><span>F5</span>
     <span>D5</span><span>C4</span><span>A3</span><span>C3</span>
    </div>
    <div class="keyboard">
     <div class="whites" id="whites"></div>
     <div class="blacks" id="blacks"></div>
    </div>
   </div>
  </div>

  <div class="section">
   <h3>十指颜色</h3>
   <div class="colorList" id="colors"></div>
  </div>

  <div class="section">
   <h3>演奏数据</h3>
   <div class="stats">
    <div class="stat"><small>记录音符</small><b id="count">0</b></div>
    <div class="stat"><small>识别手数</small><b id="hands">0</b></div>
    <div class="stat"><small>当前音符</small><b id="current">—</b></div>
    <div class="stat"><small>演奏时长</small><b id="duration">0s</b></div>
   </div>
   <div style="display:flex;gap:5px;margin-top:9px">
    <button id="saveBtn" style="flex:1">保存</button>
    <button id="loadBtn" style="flex:1">载入</button>
   </div>
   <input type="file" id="file" accept=".json" hidden>
  </div>
</aside>
</div>
<footer>MediaPipe Hands · Web Audio API · 双手十指追踪 · 霓虹轨迹</footer>
</div>

<script>
const $=id=>document.getElementById(id);
const video=$('video'),canvas=$('canvas'),ctx=canvas.getContext('2d');
const stage=$('stage');

const fingerNames=['拇指','食指','中指','无名指','小指'];
// Neon palette closer to the Douyin video (bright green + accents)
const colors=['#39ff14','#00ff9d','#7cff39','#b8ff4a','#e0ff66'];
const tips=[4,8,12,16,20];
const pips=[3,6,10,14,18];

let handsModel=null,stream=null,running=false;
let mode='live',active=false;  // active = 点击「开始」后才真正追踪
let points=[],notes=[],audio=null;
let lastTriggers={};
let playbackTimer=null,playbackStart=0;
let playbackIndex=0,recordStart=0;
let lastFrame=0,frames=0;
const MIN=48,MAX=84; // C3 ~ C6

const scales={
  C:[0,2,4,5,7,9,11],
  G:[0,2,4,6,7,9,11],
  A:[0,2,3,5,7,8,10],
  P:[0,2,4,7,9],          // major pentatonic
  Cm:[0,3,5,7,10],        // C minor pentatonic (matches the video caption)
  all:Array.from({length:12},(_,i)=>i)
};

function resize(){
  const r=stage.getBoundingClientRect();
  canvas.width=Math.round(r.width*devicePixelRatio);
  canvas.height=Math.round(r.height*devicePixelRatio);
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  draw();
}
new ResizeObserver(resize).observe(stage);

const pitch=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function noteName(m){return pitch[m%12]+(Math.floor(m/12)-1)}
function frequency(m){return 440*Math.pow(2,(m-69)/12)}

function createKeyboard(){
  for(let i=0;i<22;i++){
    let e=document.createElement('div');
    e.className='white';
    e.dataset.midi=48+i*2;
    $('whites').appendChild(e);
  }
  [1,3,6,8,10,13,15,18,20].forEach(n=>{
    let e=document.createElement('div');
    e.className='black';
    e.dataset.midi=49+(n-1)*2;
    e.style.left=(n/22*100-3.5)+'%';
    $('blacks').appendChild(e);
  });
  fingerNames.forEach((n,i)=>{
    $('colors').innerHTML+=
    `<div><i class="dot" style="background:${colors[i]};box-shadow:0 0 6px ${colors[i]}"></i>${n}</div>`;
  });
}
createKeyboard();

function getAudio(){
  if(!audio){
    const AC=window.AudioContext||window.webkitAudioContext;
    audio=new AC();
  }
  if(audio.state==='suspended')audio.resume();
  return audio;
}

function playNote(midi){
  const ac=getAudio();
  const osc=ac.createOscillator();
  const gain=ac.createGain();
  const filter=ac.createBiquadFilter();

  osc.type='triangle';
  osc.frequency.value=frequency(midi);
  filter.type='lowpass';
  filter.frequency.value=2600;

  gain.gain.setValueAtTime(.0001,ac.currentTime);
  gain.gain.exponentialRampToValueAtTime(.18,ac.currentTime+.02);
  gain.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.5);

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(ac.destination);
  osc.start();
  osc.stop(ac.currentTime+.52);

  $('current').textContent=noteName(midi);

  document.querySelectorAll('.white,.black').forEach(k=>{
    if(Number(k.dataset.midi)===midi)k.classList.add('active');
    else k.classList.remove('active');
  });
  setTimeout(()=>{
    document.querySelectorAll('.white,.black').forEach(k=>k.classList.remove('active'));
  },250);
}

function quantize(m){
  const allowed=scales[$('scale').value];
  if(!allowed)return m;
  let best=m,dist=99;
  for(let x=MIN;x<=MAX;x++){
    if(allowed.includes(x%12)&&Math.abs(x-m)<dist){
      best=x;dist=Math.abs(x-m);
    }
  }
  return best;
}

function getMidi(y){
  return quantize(Math.max(MIN,Math.min(MAX,
  Math.round(MAX-y/stage.clientHeight*(MAX-MIN)))));
}

function drawGrid(w,h){
  // horizontal note lines (like the video)
  ctx.lineWidth=1;
  const steps=12;
  for(let i=0;i<=steps;i++){
    const y=h*i/steps;
    const isMajor=i%3===0;
    ctx.strokeStyle=isMajor?'rgba(180,200,255,.22)':'rgba(180,200,255,.08)';
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();
  }
  // left-side note labels (matching screenshot style)
  ctx.fillStyle='rgba(220,230,255,.75)';
  ctx.font='11px Arial';
  ctx.textAlign='left';
  for(let i=0;i<=steps;i+=1){
    const midi=MAX-Math.round(i/steps*(MAX-MIN));
    const name=noteName(midi);
    // only show natural notes + a few accidentals to avoid clutter
    if(name.includes('#')&&i%2!==0)continue;
    ctx.fillText(name,8,h*i/steps+14);
  }
}

function draw(){
  const w=stage.clientWidth,h=stage.clientHeight;
  ctx.clearRect(0,0,w,h);
  drawGrid(w,h);

  // neon glowing trails (closer to Douyin video)
  for(let hand=0;hand<2;hand++){
    for(let f=0;f<5;f++){
      const arr=points.filter(p=>p.hand===hand&&p.finger===f);
      if(arr.length<2)continue;

      const col=colors[f];

      // outer soft glow
      ctx.save();
      ctx.lineCap='round';
      ctx.lineJoin='round';
      ctx.shadowColor=col;
      ctx.shadowBlur=28;
      ctx.strokeStyle=col;
      ctx.globalAlpha=0.45;
      ctx.lineWidth=10;
      ctx.beginPath();
      arr.forEach((p,i)=>{
        if(i===0)ctx.moveTo(p.x,p.y);
        else ctx.lineTo(p.x,p.y);
      });
      ctx.stroke();
      ctx.restore();

      // bright core
      ctx.save();
      ctx.lineCap='round';
      ctx.lineJoin='round';
      ctx.shadowColor=col;
      ctx.shadowBlur=12;
      ctx.strokeStyle=col;
      ctx.globalAlpha=1;
      ctx.lineWidth=4.5;
      ctx.beginPath();
      arr.forEach((p,i)=>{
        if(i===0)ctx.moveTo(p.x,p.y);
        else ctx.lineTo(p.x,p.y);
      });
      ctx.stroke();

      // glowing tip
      const p=arr[arr.length-1];
      ctx.shadowBlur=18;
      ctx.fillStyle=col;
      ctx.beginPath();
      ctx.arc(p.x,p.y,6,0,Math.PI*2);
      ctx.fill();

      // small sparkle
      ctx.shadowBlur=0;
      ctx.fillStyle='#ffffff';
      ctx.globalAlpha=0.9;
      ctx.beginPath();
      ctx.arc(p.x,p.y,2.2,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }

  // vertical pink playhead during playback (matches the screenshot)
  if(playbackTimer){
    const total=Math.max(1,notes.length?notes[notes.length-1].time:1);
    const x=Math.min(w,(performance.now()-playbackStart)/total*w);
    ctx.save();
    ctx.strokeStyle='#ff39ce';
    ctx.shadowColor='#ff39ce';
    ctx.shadowBlur=18;
    ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();
    // soft vertical bloom
    ctx.globalAlpha=0.25;
    ctx.lineWidth=10;
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();
    ctx.restore();
  }
}

function fingerExtended(lm,f,label){
  if(f===0){
    // thumb: compare tip vs joint horizontally
    return label==='Right'?
      lm[4].x<lm[3].x-.025:
      lm[4].x>lm[3].x+.025;
  }
  return lm[tips[f]].y<lm[pips[f]].y-.015;
}

function capture(f,x,y,hand,t){
  const key=hand+':'+f;
  const midi=getMidi(y);
  const last=lastTriggers[key]||{midi:-1,time:0};

  points.push({x,y,hand,finger:f,time:t-recordStart});
  if(points.length>6000)points.shift();

  if(midi!==last.midi||t-last.time>300){
    const event={
      time:t-recordStart,
      midi,x,y,hand,finger:f
    };
    notes.push(event);
    lastTriggers[key]={midi,time:t};

    if(mode==='live')playNote(midi);

    $('count').textContent=notes.length;
  }
}

function onResults(result){
  const now=performance.now();
  frames++;

  if(now-lastFrame>1000){
    $('fps').textContent=frames+' FPS';
    frames=0;lastFrame=now;
  }

  const found=result.multiHandLandmarks||[];
  $('hands').textContent=found.length;

  found.forEach((lm,hand)=>{
    const label=result.multiHandedness?.[hand]?.label||'Right';
    for(let f=0;f<5;f++){
      if(fingerExtended(lm,f,label)){
        if(active){  // 必须点击「开始」后才追踪
          if(!recordStart)recordStart=now;
          const tip=lm[tips[f]];
          const x=(1-tip.x)*stage.clientWidth;
          const y=tip.y*stage.clientHeight;
          capture(f,x,y,hand,now);
        }
      }
    }
  });

  if(active && recordStart){
    $('duration').textContent=((now-recordStart)/1000).toFixed(1)+'s';
  }

  draw();
}

async function startCamera(){
  try{
    if(!navigator.mediaDevices?.getUserMedia)
      throw Error('请使用 HTTPS 网站打开摄像头');

    stream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:'user',
        width:{ideal:1280},
        height:{ideal:720}
      },
      audio:false
    });

    video.srcObject=stream;
    await video.play();

    if(!window.Hands)
      throw Error('MediaPipe 加载失败，请检查网络');

    handsModel=new Hands({
      locateFile:file=>
      'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+file
    });

    handsModel.setOptions({
      maxNumHands:2,
      modelComplexity:1,
      minDetectionConfidence:.65,
      minTrackingConfidence:.6
    });

    handsModel.onResults(onResults);

    running=true;
    stage.classList.add('started');
    $('status').textContent='● 摄像头已就绪，请点击「开始」';
    $('cameraBtn').textContent='关闭摄像头';
    $('startBtn').disabled=false;
    $('startBtn').textContent='▶ 开始';

    async function loop(){
      if(!running)return;
      if(video.readyState>=2){
        try{await handsModel.send({image:video})}
        catch(e){console.error(e)}
      }
      requestAnimationFrame(loop);
    }
    loop();
    getAudio();

  }catch(e){
    alert('启动失败：'+e.message);
    console.error(e);
  }
}

function stopCamera(){
  running=false;
  active=false;
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=null;
  video.srcObject=null;
  if(handsModel){handsModel.close();handsModel=null}
  stage.classList.remove('started');
  $('cameraBtn').textContent='启动摄像头';
  $('status').textContent='● 摄像头已关闭';
  $('startBtn').disabled=true;
  $('startBtn').textContent='▶ 开始';
  $('startBtn').classList.add('pink');
  $('startBtn').classList.remove('primary');
}

$('cameraBtn').onclick=()=>{
  if(running)stopCamera();
  else startCamera();
};

// 点击「开始 / 停止」才真正开始追踪演奏
$('startBtn').onclick=()=>{
  if(!running){
    alert('请先启动摄像头');
    return;
  }
  active=!active;
  if(active){
    recordStart=performance.now();
    $('startBtn').textContent='■ 停止';
    $('startBtn').classList.remove('pink');
    $('startBtn').classList.add('primary');
    $('status').textContent='● 演奏中…';
    getAudio();
  }else{
    $('startBtn').textContent='▶ 开始';
    $('startBtn').classList.add('pink');
    $('startBtn').classList.remove('primary');
    $('status').textContent='● 已暂停，点击「开始」继续';
  }
};

function setMode(m){
  mode=m;
  $('liveMode').classList.toggle('active',m==='live');
  $('drawMode').classList.toggle('active',m==='record');

  $('modeText').textContent=m==='live'?
  '点击「开始」后，手指移动立即发声。':
  '点击「开始」记录轨迹，结束后点「回放」聆听。';
}

$('liveMode').onclick=()=>setMode('live');
$('drawMode').onclick=()=>setMode('record');

function stopPlayback(){
  if(playbackTimer){
    clearInterval(playbackTimer);
    playbackTimer=null;
  }
  $('progress').style.width='0%';
}

function playRecorded(){
  if(!notes.length){
    alert('请先绘画记录旋律');
    return;
  }

  stopPlayback();
  notes.sort((a,b)=>a.time-b.time);
  getAudio();

  playbackStart=performance.now();
  playbackIndex=0;
  const total=Math.max(1,notes[notes.length-1].time);

  playbackTimer=setInterval(()=>{
    const t=performance.now()-playbackStart;

    while(playbackIndex<notes.length&&
      notes[playbackIndex].time<=t){
      playNote(notes[playbackIndex].midi);
      playbackIndex++;
    }

    $('progress').style.width=
      Math.min(100,t/total*100)+'%';

    if(t>total+500)stopPlayback();
  },12);
}

$('playBtn').onclick=playRecorded;

$('clearBtn').onclick=()=>{
  stopPlayback();
  points=[];notes=[];lastTriggers={};
  recordStart=0;
  $('count').textContent=0;
  $('current').textContent='—';
  $('duration').textContent='0s';
  draw();
};

$('saveBtn').onclick=()=>{
  if(!notes.length){alert('没有旋律可以保存');return}
  const data={
    version:2,
    notes,points,
    scale:$('scale').value
  };
  const blob=new Blob(
    [JSON.stringify(data,null,2)],
    {type:'application/json'}
  );
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='air-piano-melody.json';
  a.click();
  URL.revokeObjectURL(a.href);
};

$('loadBtn').onclick=()=>$('file').click();

$('file').onchange=async e=>{
  const file=e.target.files[0];
  if(!file)return;
  try{
    const data=JSON.parse(await file.text());
    if(!Array.isArray(data.notes)||!Array.isArray(data.points))
      throw Error('文件格式不正确');
    notes=data.notes;
    points=data.points;
    $('scale').value=data.scale||'C';
    $('count').textContent=notes.length;
    draw();
    alert('旋律载入成功');
  }catch(err){alert('载入失败：'+err.message)}
  e.target.value='';
};

$('fullscreenBtn').onclick=async()=>{
  try{
    if(!document.fullscreenElement){
      await document.documentElement.requestFullscreen();
    }else{
      await document.exitFullscreen();
    }
  }catch(e){
    alert('浏览器不支持网页全屏，请使用浏览器菜单全屏');
  }
};

document.addEventListener('fullscreenchange',()=>{
  document.body.classList.toggle('fullscreen',!!document.fullscreenElement);
  setTimeout(resize,150);
});

window.addEventListener('resize',resize);
resize();
setMode('live');
</script>
</body>
</html>
