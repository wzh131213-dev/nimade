
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Three.js 3D人物展示</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#10131c;color:white;font-family:Arial,sans-serif
}
#view{position:absolute;inset:0}
#status{
  position:absolute;z-index:5;top:15px;left:15px;
  padding:12px 16px;background:#202a3c;
  border:1px solid #40506a;border-radius:12px;
  font-size:13px;max-width:90vw
}
#tools{
  position:absolute;z-index:5;bottom:20px;left:50%;
  transform:translateX(-50%);display:flex;gap:10px;
  width:max-content;max-width:95vw
}
button{
  border:0;border-radius:10px;padding:12px 18px;
  background:#2878e8;color:white;font-size:14px
}
#file{
  position:absolute;bottom:75px;left:15px;
  color:#aebbd0;font-size:12px
}
</style>
</head>

<body>
<div id="view"></div>
<div id="status">正在启动 Three.js……</div>
<div id="file">模型：Sci-Fi Swordsman.ply</div>
<div id="tools">
  <button id="reset">重置视角</button>
  <button id="reload">重新加载</button>
</div>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.webgpu.js",
    "three/webgpu":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.webgpu.js",
    "three/tsl":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.tsl.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import {GaussianSplatPLYLoader}
  from 'three/addons/loaders/GaussianSplatPLYLoader.js';
import {GaussianSplat}
  from 'three/addons/objects/GaussianSplat.js';

const container=document.getElementById('view');
const status=document.getElementById('status');

let renderer,scene,camera,character;

const setStatus=(msg)=>status.textContent=msg;

async function init(){

  try{
    setStatus('正在初始化 GPU 渲染器……');

    scene=new THREE.Scene();
    scene.background=new THREE.Color(0x10131c);

    camera=new THREE.PerspectiveCamera(
      45,window.innerWidth/window.innerHeight,0.01,100
    );

    camera.position.set(0,1.1,4);
    camera.lookAt(0,1,0);

    renderer=new THREE.WebGPURenderer({
      antialias:true,
      alpha:false,
      forceWebGL:true
    });

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio,2)
    );

    renderer.setSize(
      window.innerWidth,window.innerHeight
    );

    container.appendChild(renderer.domElement);

    await renderer.init();

    setStatus('GPU 已启动，正在读取 PLY……');

    await loadModel();

    renderer.setAnimationLoop(()=>{
      renderer.render(scene,camera);
    });

  }catch(error){
    console.error(error);
    setStatus('启动失败：'+error.message);
  }
}

async function loadModel(){

  try{
    if(character){
      scene.remove(character);
      character.geometry?.dispose?.();
      character.material?.dispose?.();
      character=null;
    }

    setStatus('正在读取人物 PLY 数据……');

    const loader=new GaussianSplatPLYLoader();

    const geometry=await loader.loadAsync(
      './Sci-Fi%20Swordsman.ply'
    );

    console.log('PLY geometry:',geometry);
    console.log('Attributes:',geometry.attributes);

    character=new GaussianSplat(geometry,{
      autoSort:true
    });

    character.position.set(
      -0.06267,-0.01593,-0.02657
    );

    character.scale.setScalar(1);

    scene.add(character);

    character.computeBoundingBox();
    character.computeBoundingSphere();

    camera.position.set(0,1.05,4);
    camera.lookAt(0,1,0);

    setStatus(
      '人物加载成功！可以拖动屏幕旋转观察。'
    );

  }catch(error){
    console.error('PLY加载失败:',error);
    setStatus('人物加载失败：'+error.message);
  }
}

document.getElementById('reload').onclick=loadModel;

document.getElementById('reset').onclick=()=>{
  camera.position.set(0,1.05,4);
  camera.lookAt(0,1,0);
};

window.addEventListener('resize',()=>{
  if(!camera||!renderer)return;

  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,window.innerHeight
  );
});

let dragging=false,lastX=0,lastY=0;
let angle=0,elevation=0.1;

rendererControl();

function rendererControl(){
  container.addEventListener('pointerdown',e=>{
    dragging=true;
    lastX=e.clientX;
    lastY=e.clientY;
  });

  window.addEventListener('pointerup',()=>{
    dragging=false;
  });

  window.addEventListener('pointermove',e=>{
    if(!dragging||!camera)return;

    angle-=(e.clientX-lastX)*0.006;
    elevation+=(e.clientY-lastY)*0.004;
    elevation=Math.max(-1,Math.min(1,elevation));

    lastX=e.clientX;
    lastY=e.clientY;

    const radius=4;
    camera.position.set(
      Math.sin(angle)*radius,
      1.05+elevation,
      Math.cos(angle)*radius
    );

    camera.lookAt(0,1,0);
  });
}

init();
</script>
</body>
</html>
