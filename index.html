
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D 四肢动作捕捉系统</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  overflow:hidden;
  background:#080d18;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
#app{position:relative;width:100vw;height:100dvh;overflow:hidden}
#three{position:absolute;inset:0}
#video{
  position:absolute;
  right:14px;
  top:76px;
  width:min(31vw,250px);
  aspect-ratio:4/3;
  object-fit:cover;
  border:1px solid #53657d;
  border-radius:13px;
  background:#101827;
  z-index:3;
}
#video.front-camera{transform:scaleX(-1)}
#video.back-camera{transform:scaleX(1)}
.top{
  position:absolute;z-index:5;top:14px;left:14px;
  padding:12px 15px;border-radius:12px;
  background:#101b2cdd;border:1px solid #34445c;
}
.top strong{font-size:15px}
.top small{display:block;color:#9eacc1;margin-top:5px}
#status{
  position:absolute;z-index:5;left:14px;top:91px;
  padding:8px 11px;border-radius:9px;
  background:#101b2cdd;color:#a8e5c4;font-size:12px;
}
#info{
  position:absolute;z-index:4;left:14px;bottom:120px;
  padding:11px 13px;border-radius:11px;
  background:#101b2cdd;border:1px solid #34445c;
  color:#cbd6e6;font-size:12px;line-height:1.8;
}
.controls{
  position:absolute;z-index:6;bottom:0;left:0;right:0;
  display:flex;justify-content:center;align-items:center;
  flex-wrap:wrap;gap:9px;padding:13px;
  background:linear-gradient(transparent,#080d18 25%);
}
button{
  border:1px solid #425675;
  color:#fff;background:#17263b;
  border-radius:10px;padding:11px 15px;
  font-size:13px;font-weight:600;
  cursor:pointer;
}
button.primary{background:#2563eb;border-color:#4382ff}
button:active{transform:scale(.96)}
button:disabled{opacity:.4}
@media(max-width:600px){
  .top{top:10px;left:10px;padding:9px 11px}
  #video{top:75px;right:10px;width:37vw}
  #status{top:83px;left:10px}
  #info{left:10px;bottom:145px;font-size:11px}
  .controls{gap:7px;padding:10px 7px}
  button{padding:10px 11px;font-size:12px}
}
</style>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>

<body>
<div id="app">
  <div id="three"></div>

  <div class="top">
    <strong>3D 四肢动作捕捉</strong>
    <small>实时骨骼识别 · 程序化模型</small>
  </div>

  <div id="status">等待启动摄像头</div>

  <video id="video" autoplay playsinline muted></video>

  <div id="info">
    左臂：等待识别<br>
    右臂：等待识别<br>
    左腿：等待识别<br>
    右腿：等待识别
  </div>

  <div class="controls">
    <button class="primary" id="startBtn">启动摄像头</button>
    <button id="frontBtn">前置摄像头</button>
    <button id="backBtn">后置摄像头</button>
    <button id="stopBtn">停止识别</button>
    <button id="resetBtn">重置视角</button>
    <button id="rotateBtn">自动旋转：关</button>
  </div>
</div>

<script type="module">
import * as THREE from "three";
import {
  PoseLandmarker,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const $ = id => document.getElementById(id);
const video = $("video");
const statusEl = $("status");
const infoEl = $("info");

let scene, camera, renderer, model;
let poseLandmarker = null;
let stream = null;
let running = false;
let busy = false;
let cameraFacing = "user";
let animationFrame = null;
let autoRotate = false;
let lastVideoTime = -1;
let lastLandmarks = null;

const clock = new THREE.Clock();
const smooth = {};
const limbs = {};
const joints = {};

initThree();
animate();

function initThree(){
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x080d18);

  camera = new THREE.PerspectiveCamera(
    42, window.innerWidth/window.innerHeight, 0.1, 100
  );
  camera.position.set(0,1.2,6.5);
  camera.lookAt(0,0.4,0);

  renderer = new THREE.WebGLRenderer({antialias:true,alpha:false});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  $("three").appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xa9caff,0x172033,2));

  const light = new THREE.DirectionalLight(0xffffff,2.5);
  light.position.set(3,5,5);
  scene.add(light);

  const floor = new THREE.GridHelper(12,24,0x263b59,0x17263b);
  floor.position.y=-1.35;
  scene.add(floor);

  model = new THREE.Group();
  scene.add(model);

  // 仅生成四肢，不生成头部、躯干和服装
  const definitions = [
    ["leftUpperArm",0x39b9ff],
    ["leftForearm",0x28e0c1],
    ["rightUpperArm",0xffa33b],
    ["rightForearm",0xffcc55],
    ["leftThigh",0x8e83ff],
    ["leftShin",0x5e9cff],
    ["rightThigh",0xff6c9d],
    ["rightShin",0xffa0b9]
  ];

  for(const [name,color] of definitions){
    limbs[name] = makeBone(color);
    model.add(limbs[name].mesh);
  }

  const jointNames=[
    "leftShoulder","leftElbow","leftWrist",
    "rightShoulder","rightElbow","rightWrist",
    "leftHip","leftKnee","leftAnkle",
    "rightHip","rightKnee","rightAnkle"
  ];

  for(const name of jointNames){
    const material=new THREE.MeshStandardMaterial({
      color:0xeaf5ff,
      metalness:.3,
      roughness:.28,
      emissive:0x153c5c
    });
    const mesh=new THREE.Mesh(
      new THREE.SphereGeometry(.075,16,12),material
    );
    model.add(mesh);
    joints[name]=mesh;
  }

  // 简化手掌和脚掌
  limbs.leftHand=makeBone(0x39d9e8,.09);
  limbs.rightHand=makeBone(0xffbd58,.09);
  limbs.leftFoot=makeBone(0x5e9cff,.12);
  limbs.rightFoot=makeBone(0xff7fa9,.12);

  model.add(
    limbs.leftHand.mesh,
    limbs.rightHand.mesh,
    limbs.leftFoot.mesh,
    limbs.rightFoot.mesh
  );

  window.addEventListener("resize",onResize);
}

function makeBone(color,radius=.065){
  const geometry=new THREE.CylinderGeometry(radius,radius,1,12);
  const material=new THREE.MeshStandardMaterial({
    color,
    metalness:.25,
    roughness:.35,
    emissive:color,
    emissiveIntensity:.08
  });
  const mesh=new THREE.Mesh(geometry,material);
  return {mesh};
}

function setBone(name,a,b){
  if(!a||!b)return;
  const A=vector(a);
  const B=vector(b);
  const direction=new THREE.Vector3().subVectors(B,A);
  const length=direction.length();

  if(length<0.001)return;

  const bone=limbs[name].mesh;
  bone.position.copy(A).add(B).multiplyScalar(.5);
  bone.scale.set(1,length,1);
  bone.quaternion.setFromUnitVectors(
    new THREE.Vector3(0,1,0),
    direction.normalize()
  );
}

function setJoint(name,p){
  if(!p)return;
  joints[name].position.copy(vector(p));
}

function vector(p){
  return new THREE.Vector3(p.x,p.y,p.z);
}

function smoothPoint(name,p){
  if(!p)return null;
  if(!smooth[name])smooth[name]={...p};
  const old=smooth[name];
  const t=.38;
  old.x+=(p.x-old.x)*t;
  old.y+=(p.y-old.y)*t;
  old.z+=(p.z-old.z)*t;
  return {...old};
}

function landmarkPoint(landmarks,index){
  const p=landmarks?.[index];
  if(!p)return null;

  // worldLandmarks 的坐标转换到 Three.js 坐标
  return smoothPoint("p"+index,{
    x:p.x,
    y:-p.y,
    z:-p.z
  });
}

function updatePose(landmarks){
  if(!landmarks || landmarks.length<33)return;

  const p={
    ls:landmarkPoint(landmarks,11),
    rs:landmarkPoint(landmarks,12),
    le:landmarkPoint(landmarks,13),
    re:landmarkPoint(landmarks,14),
    lw:landmarkPoint(landmarks,15),
    rw:landmarkPoint(landmarks,16),
    lh:landmarkPoint(landmarks,23),
    rh:landmarkPoint(landmarks,24),
    lk:landmarkPoint(landmarks,25),
    rk:landmarkPoint(landmarks,26),
    la:landmarkPoint(landmarks,27),
    ra:landmarkPoint(landmarks,28),
    lf:landmarkPoint(landmarks,31),
    rf:landmarkPoint(landmarks,32)
  };

  const all=Object.values(p).filter(Boolean);
  if(!all.length)return;

  // 根据身体中心和人体尺度调整模型
  const center=new THREE.Vector3();
  for(const point of all)center.add(vector(point));
  center.divideScalar(all.length);

  for(const point of all){
    point.x-=center.x;
    point.y-=center.y;
    point.z-=center.z;
  }

  // 放大显示，保留人体自身四肢比例
  const scale=2.4;
  for(const point of all){
    point.x*=scale;
    point.y*=scale;
    point.z*=scale;
  }

  setBone("leftUpperArm",p.ls,p.le);
  setBone("leftForearm",p.le,p.lw);
  setBone("rightUpperArm",p.rs,p.re);
  setBone("rightForearm",p.re,p.rw);

  setBone("leftThigh",p.lh,p.lk);
  setBone("leftShin",p.lk,p.la);
  setBone("rightThigh",p.rh,p.rk);
  setBone("rightShin",p.rk,p.ra);

  // 手掌方向：用前臂方向延伸估算
  const leftHandEnd=extend(p.lw,p.le,.28);
  const rightHandEnd=extend(p.rw,p.re,.28);
  setBone("leftHand",p.lw,leftHandEnd);
  setBone("rightHand",p.rw,rightHandEnd);

  // 脚掌方向：利用脚尖位置
  setBone("leftFoot",p.la,p.lf);
  setBone("rightFoot",p.ra,p.rf);

  setJoint("leftShoulder",p.ls);
  setJoint("leftElbow",p.le);
  setJoint("leftWrist",p.lw);
  setJoint("rightShoulder",p.rs);
  setJoint("rightElbow",p.re);
  setJoint("rightWrist",p.rw);
  setJoint("leftHip",p.lh);
  setJoint("leftKnee",p.lk);
  setJoint("leftAnkle",p.la);
  setJoint("rightHip",p.rh);
  setJoint("rightKnee",p.rk);
  setJoint("rightAnkle",p.ra);

  infoEl.innerHTML=
    `左臂：${distance(p.ls,p.le,p.lw)}<br>`+
    `右臂：${distance(p.rs,p.re,p.rw)}<br>`+
    `左腿：${distance(p.lh,p.lk,p.la)}<br>`+
    `右腿：${distance(p.rh,p.rk,p.ra)}`;
}

function extend(end,from,length){
  const a=vector(end);
  const b=vector(from);
  const d=new THREE.Vector3().subVectors(a,b).normalize();
  return {
    x:a.x+d.x*length,
    y:a.y+d.y*length,
    z:a.z+d.z*length
  };
}

function distance(a,b,c){
  if(!a||!b||!c)return "等待识别";
  const d1=vector(a).distanceTo(vector(b));
  const d2=vector(b).distanceTo(vector(c));
  return (d1+d2).toFixed(2)+" 单位";
}

async function initializePose(){
  if(poseLandmarker)return;

  statusEl.textContent="正在加载人体识别模型…";

  const vision=await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );

  poseLandmarker=await PoseLandmarker.createFromOptions(vision,{
    baseOptions:{
      modelAssetPath:
      "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task",
      delegate:"GPU"
    },
    runningMode:"VIDEO",
    numPoses:1,
    minPoseDetectionConfidence:.5,
    minPosePresenceConfidence:.5,
    minTrackingConfidence:.5
  });
}

async function startCamera(facing="user"){
  if(busy)return;
  busy=true;

  try{
    await stopCamera(false);
    cameraFacing=facing;

    statusEl.textContent=
      facing==="user"?"正在启动前置摄像头…":"正在启动后置摄像头…";

    await initializePose();

    const newStream=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:{exact:facing},
        width:{ideal:1280},
        height:{ideal:720}
      }
    });

    stream=newStream;
    video.srcObject=stream;
    video.className=facing==="user"?"front-camera":"back-camera";

    await video.play();

    running=true;
    lastVideoTime=-1;

    statusEl.textContent=
      facing==="user"?"前置摄像头已启动":"后置摄像头已启动";

    $("startBtn").disabled=true;
    $("frontBtn").disabled=false;
    $("backBtn").disabled=false;

    detectLoop();

  }catch(error){
    running=false;
    statusEl.textContent="启动失败："+error.message;
    console.error(error);
    await stopCamera(false);
  }finally{
    busy=false;
  }
}

function detectLoop(){
  if(!running)return;

  if(video.readyState>=2 && video.currentTime!==lastVideoTime){
    lastVideoTime=video.currentTime;

    try{
      const result=poseLandmarker.detectForVideo(video,performance.now());

      if(result.worldLandmarks && result.worldLandmarks.length){
        lastLandmarks=result.worldLandmarks[0];
        updatePose(lastLandmarks);
        statusEl.textContent="正在实时捕捉人体动作";
      }else{
        statusEl.textContent="未检测到人体，请站在摄像头前";
      }
    }catch(error){
      console.error("识别错误：",error);
    }
  }

  animationFrame=requestAnimationFrame(detectLoop);
}

async function stopCamera(closeModel=true){
  running=false;

  if(animationFrame!==null){
    cancelAnimationFrame(animationFrame);
    animationFrame=null;
  }

  if(stream){
    stream.getTracks().forEach(track=>track.stop());
    stream=null;
  }

  video.srcObject=null;
  $("startBtn").disabled=false;

  if(closeModel && poseLandmarker){
    poseLandmarker.close();
    poseLandmarker=null;
  }

  if(closeModel){
    statusEl.textContent="摄像头已停止";
  }
}

function resetView(){
  camera.position.set(0,1.2,6.5);
  camera.lookAt(0,0.4,0);
  model.rotation.set(0,0,0);
  model.position.set(0,0,0);
}

function onResize(){
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
}

function animate(){
  requestAnimationFrame(animate);
  const delta=clock.getDelta();

  if(autoRotate && !running){
    model.rotation.y+=delta*.5;
  }

  renderer.render(scene,camera);
}

// 按钮事件
$("startBtn").addEventListener("click",()=>{
  startCamera(cameraFacing);
});

$("frontBtn").addEventListener("click",()=>{
  startCamera("user");
});

$("backBtn").addEventListener("click",()=>{
  startCamera("environment");
});

$("stopBtn").addEventListener("click",()=>{
  stopCamera();
});

$("resetBtn").addEventListener("click",resetView);

$("rotateBtn").addEventListener("click",()=>{
  autoRotate=!autoRotate;
  $("rotateBtn").textContent=
    "自动旋转："+(autoRotate?"开":"关");
});

window.addEventListener("beforeunload",()=>{
  if(stream)stream.getTracks().forEach(track=>track.stop());
});
</script>
</body>
</html>
