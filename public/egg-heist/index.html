<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101c2b"><meta name="description" content="无广告 3D 偷蛋、逃脱、孵化宠物与基地经营游戏"><title>蛋仔大冒险 · Egg Heist</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,"PingFang SC",sans-serif}*{box-sizing:border-box}body{margin:0;background:#101c2b;color:#fff;overflow:hidden}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;align-items:center;padding:14px;gap:8px}.brand,.stats,.panel,.actions button,.modal{background:#10243bdc;border:1px solid #ffffff22;backdrop-filter:blur(12px);box-shadow:0 8px 30px #0003;border-radius:16px}.brand{padding:10px 14px;font-weight:900}.stats{display:flex;gap:14px;padding:10px 14px;font-weight:800}.panel{position:absolute;left:14px;top:88px;padding:14px;width:min(260px,44vw);font-size:13px;line-height:1.7}.panel b{color:#ffe18b}.right{left:auto;right:14px;width:180px}.right button{width:100%;margin-top:8px;padding:10px;border:0;border-radius:10px;background:#f7c85d;color:#38260b;font-weight:900}.bottom{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);padding:9px 14px;background:#10243bdc;border-radius:30px;font-size:12px;white-space:nowrap}.actions{position:absolute;right:18px;bottom:24px;display:flex;gap:9px;pointer-events:auto}.actions button{width:66px;height:66px;border-radius:50%;color:white;font-size:12px;font-weight:800}.actions button:active{transform:scale(.94)}#joystick{position:absolute;left:20px;bottom:25px;width:112px;height:112px;border-radius:50%;background:#ffffff20;border:1px solid #ffffff44;pointer-events:auto;touch-action:none}#knob{position:absolute;width:48px;height:48px;left:31px;top:31px;border-radius:50%;background:#ffffff99}.modal{position:absolute;inset:0;margin:auto;width:min(420px,calc(100vw - 32px));height:max-content;padding:26px;text-align:center;pointer-events:auto}.modal h1{font-size:28px;margin:8px}.modal p{color:#c6d4e5;line-height:1.6}.modal button{background:#ffd36b;border:0;border-radius:12px;padding:13px 24px;font-weight:900;font-size:16px;color:#38260b}.hidden{display:none!important}.hint{color:#b7cbe0;font-size:12px}@media(max-width:700px){.panel{top:78px;width:150px;padding:10px;font-size:11px}.right{top:210px}.stats{font-size:12px;gap:8px;padding:9px}.brand{font-size:12px;padding:9px}.bottom{bottom:145px}.actions button{width:58px;height:58px}#joystick{width:100px;height:100px}#knob{left:26px;top:26px}}
</style></head><body><div id="game"></div><div class="hud"><div class="top"><div class="brand">🥚 蛋仔大冒险</div><div class="stats"><span>🪙 <b id="coins">120</b></span><span>🥚 <b id="eggs">0</b></span><span>🐾 <b id="pets">0</b></span></div></div><div class="panel"><b>今日任务</b><div id="task">找到蛋巢，偷蛋并带回基地！</div><hr style="border-color:#ffffff22"><div>🏃 速度：<b id="speed">5.5</b></div><div>💰 每秒收益：<b id="income">0</b></div><div>📦 成功带回：<b id="count">0</b></div><div class="hint">WASD 移动 · E 互动 · Shift 冲刺</div></div><div class="panel right"><b>基地成长</b><button id="hatch">🥚 孵化宠物</button><button id="upgrade">⚡ 速度升级 · 100</button><button id="reset">↻ 重置进度</button></div><div class="bottom" id="status">先靠近地图上的蛋巢</div><div id="joystick"><div id="knob"></div></div><div class="actions"><button id="dash">⚡<br>冲刺</button><button id="jump">⬆<br>跳跃</button><button id="interact">✋<br>互动</button></div></div>
<div class="modal" id="welcome"><div style="font-size:48px">🥚🐣</div><h1>欢迎来到蛋仔大冒险</h1><p>潜入蛋巢偷取鸡蛋，躲开守卫追击，安全带回基地孵化宠物。宠物会持续为你赚取金币。</p><button id="start">开始冒险</button><p class="hint">纯净无广告 · 进度自动保存在本设备</p></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const $=id=>document.getElementById(id),saveKey='egg-heist-nimade-v1';
let data={coins:120,eggs:0,pets:0,count:0,speed:5.5};try{data={...data,...JSON.parse(localStorage.getItem(saveKey)||'{}')}}catch{}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x91c9ed);scene.fog=new THREE.Fog(0x91c9ed,35,90);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,150);camera.position.set(0,9,13);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;$('game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xeaf7ff,0x54734b,2));const sun=new THREE.DirectionalLight(0xfff0d1,2.2);sun.position.set(-12,22,12);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(c,r=.8)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
function box(x,y,z,sx,sy,sz,color){const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat(color));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100),mat(0x72b95f));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const path=box(0,.025,0,5,.05,44,0xc6b27c);
const base=box(0,.18,13,13,.35,10,0x4e9bc1);const pad=box(0,.4,13,7,.15,5,0x8bd9cf);
box(0,.8,16,3,1.2,.5,0x23627c);box(-4,.8,13,.5,1.2,3,0x23627c);box(4,.8,13,.5,1.2,3,0x23627c);
const eggSpots=[new THREE.Vector3(-7,0,-12),new THREE.Vector3(7,0,-18),new THREE.Vector3(0,0,-27)];
const eggMeshes=eggSpots.map((p,i)=>{const g=new THREE.Group();const shell=new THREE.Mesh(new THREE.SphereGeometry(.62,.28,20),mat([0xffd56b,0x8be0bc,0xb7a1ff][i]));shell.scale.y=1.35;shell.castShadow=true;g.add(shell);const ring=new THREE.Mesh(new THREE.TorusGeometry(.65,.08,8,24),mat(0xffffff));ring.rotation.x=Math.PI/2;ring.position.y=-.48;g.add(ring);g.position.copy(p);scene.add(g);return g});
const player=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,.75,5,12),mat(0x397de0));body.position.y=.9;body.castShadow=true;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.38,16,12),mat(0xffd4a4));head.position.y=1.65;head.castShadow=true;player.add(head);player.position.set(0,0,13);scene.add(player);
const enemy=new THREE.Group();const eb=new THREE.Mesh(new THREE.CapsuleGeometry(.48,.8,5,12),mat(0xe45b56));eb.position.y=.9;eb.castShadow=true;enemy.add(eb);const eh=new THREE.Mesh(new THREE.SphereGeometry(.35,16,12),mat(0xffc3a0));eh.position.y=1.65;enemy.add(eh);enemy.position.set(0,0,-7);scene.add(enemy);
const pets=[];const trees=[];for(let i=0;i<24;i++){let x=(Math.random()-.5)*48,z=(Math.random()-.5)*55;if(Math.abs(x)<9&&z>0)continue;const trunk=box(x,.7,z,.45,1.4,.45,0x805535);const crown=new THREE.Mesh(new THREE.SphereGeometry(1.35,12,10),mat(0x328b54));crown.position.set(x,2,z);crown.castShadow=true;scene.add(crown);trees.push(trunk)}
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')interact()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let joy={x:0,y:0},drag=null,carrying=false,enemyMode=false,started=false,last=performance.now(),incomeTimer=0,dashUntil=0;
const joyEl=$('joystick'),knob=$('knob');joyEl.addEventListener('pointerdown',e=>{joyEl.setPointerCapture(e.pointerId);drag=e.pointerId;moveJoy(e)});joyEl.addEventListener('pointermove',e=>{if(drag===e.pointerId)moveJoy(e)});function moveJoy(e){const r=joyEl.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),d=Math.hypot(dx,dy),k=Math.min(1,42/(d||1));joy.x=dx*k/42;joy.y=dy*k/42;knob.style.transform=`translate(${joy.x*30}px,${joy.y*30}px)`}function stopJoy(){drag=null;joy={x:0,y:0};knob.style.transform=''}joyEl.addEventListener('pointerup',stopJoy);joyEl.addEventListener('pointercancel',stopJoy);
$('dash').onclick=()=>dashUntil=performance.now()+550;$('jump').onclick=()=>{player.position.y=.8;setTimeout(()=>player.position.y=0,380)};$('interact').onclick=interact;$('start').onclick=()=>{$('welcome').classList.add('hidden');started=true};
function near(p,q,r){return p.distanceTo(q)<r}
function interact(){if(!started)return;if(carrying){if(player.position.z>7){carrying=false;data.eggs++;data.count++;eggMeshes.forEach((e,i)=>{if(e.visible===false)e.visible=true});$('task').textContent='成功带回一颗蛋！去孵化宠物吧。';$('status').textContent='安全入库！鸡蛋已放进孵化器。';enemyMode=false;enemy.position.set(0,0,-7);save()}else $('status').textContent='先回到基地区域！';return}
let idx=eggMeshes.findIndex((e)=>e.visible&&near(player.position,e.position,2.2));if(idx>=0){carrying=true;eggMeshes[idx].visible=false;enemyMode=true;$('task').textContent='守卫发现你了！快逃回基地！';$('status').textContent='你偷到了蛋！守卫正在追击！';return}
if(player.position.z>9){$('status').textContent='基地安全区：靠近蛋巢偷取鸡蛋。'}else $('status').textContent='靠近发光的蛋巢后按互动键。'}
$('hatch').onclick=()=>{if(data.eggs<1){$('status').textContent='还没有鸡蛋，先去偷一颗！';return}data.eggs--;data.pets++;const pet=new THREE.Group();const c=new THREE.Mesh(new THREE.SphereGeometry(.42,16,12),mat([0xffd56b,0xff8caa,0x8be0bc,0xb7a1ff][data.pets%4]));c.position.y=.45;c.castShadow=true;pet.add(c);const e1=new THREE.SphereGeometry(.1,8,8);for(let i=-1;i<=1;i+=2){const eye=new THREE.Mesh(e1,mat(0x17202c));eye.position.set(i*.15,.52,.34);pet.add(eye)}pet.position.set((Math.random()-.5)*3,.2,10+Math.random()*2);scene.add(pet);pets.push(pet);$('status').textContent='孵化成功！新宠物开始跟随并赚取金币。';save()};
$('upgrade').onclick=()=>{let cost=Math.round(100*Math.pow(1.65,Math.max(0,data.speed-5.5)));if(data.coins<cost){$('status').textContent='金币不足！让宠物继续工作或去偷蛋。';return}data.coins-=cost;data.speed+=.6;$('status').textContent='速度升级成功！';save()};
$('reset').onclick=()=>{if(confirm('确定清空本设备的游戏存档吗？')){localStorage.removeItem(saveKey);location.reload()}};
function save(){localStorage.setItem(saveKey,JSON.stringify(data));ui()}function ui(){$('coins').textContent=Math.floor(data.coins);$('eggs').textContent=data.eggs;$('pets').textContent=data.pets;$('count').textContent=data.count;$('speed').textContent=data.speed.toFixed(1);$('income').textContent=data.pets*2;$('upgrade').textContent='⚡ 速度升级 · '+Math.round(100*Math.pow(1.65,Math.max(0,data.speed-5.5)));}$('status').textContent='靠近远处发光的蛋巢，按互动键偷蛋';ui();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.04,(now-last)/1000);last=now;if(started){let x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x,z=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joy.y;const len=Math.hypot(x,z);if(len>1){x/=len;z/=len}const boost=now<dashUntil?1.8:1;player.position.x=THREE.MathUtils.clamp(player.position.x+x*data.speed*boost*dt,-21,21);player.position.z=THREE.MathUtils.clamp(player.position.z+z*data.speed*boost*dt,-32,20);if(len>.05)player.rotation.y=Math.atan2(x,z);
if(carrying){enemyMode=true;const dx=player.position.x-enemy.position.x,dz=player.position.z-enemy.position.z,d=Math.hypot(dx,dz)||1;enemy.position.x+=dx/d*3.5*dt;enemy.position.z+=dz/d*3.5*dt;if(d<1.1){carrying=false;const nearEgg=eggMeshes.find(e=>!e.visible);if(nearEgg)nearEgg.visible=true;enemyMode=false;enemy.position.set(0,0,-7);$('status').textContent='被守卫抓住了！鸡蛋掉落了，再试一次。'}}else{enemy.position.x=Math.sin(now*.0007)*3;enemy.position.z=-7+Math.cos(now*.0005)*2}
pets.forEach((p,i)=>{const a=now*.001+i*2.4;p.position.x=player.position.x+Math.cos(a)*1.5;p.position.z=player.position.z+Math.sin(a)*1.5;p.position.y=.2+Math.abs(Math.sin(now*.006+i))*.25});
incomeTimer+=dt;if(incomeTimer>1){data.coins+=data.pets*2;incomeTimer=0;ui();save()}}
const target=new THREE.Vector3(player.position.x,1,player.position.z);const desired=new THREE.Vector3(player.position.x,8,player.position.z+11);camera.position.lerp(desired,.08);camera.lookAt(target);eggMeshes.forEach((e,i)=>{if(e.visible)e.position.y=.15+Math.sin(now*.002+i)*.15});renderer.render(scene,camera)}
requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
